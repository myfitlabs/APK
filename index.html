d lower stiffness (Nakamura et al., 2021).<\u002Fli>\n          <li>Daily beat three times per week (Cipriani et al., 2012).<\u002Fli>\n          <li><strong>Once a day, 5–6 days a week<\u002Fstrong> is likely optimal for many athletes.<\u002Fli>\n          <li>SMT: no known reason it can't be daily or most days in healthy athletes, subject to precautions and medical advice.<\u002Fli>\n        <\u002Ful>\n\n        <h3>Volume<\u002Fh3>\n        <ul>\n          <li>Weekly volume may matter more than time per stretch. At least <strong>5 min per week<\u002Fstrong> beats less, but more than <strong>10 min per week<\u002Fstrong> adds little (Thomas et al., 2018).<\u002Fli>\n          <li>A <strong>6–12 min<\u002Fstrong> dynamic routine improved flexibility, but longer bouts might impair repeated high-intensity work (Ryan et al., 2014).<\u002Fli>\n          <li>SMT: 5–10 min total, 90–120 s per muscle group.<\u002Fli>\n        <\u002Ful>\n\n        <h3>How NSCA doses it<\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Method<\u002Fsc-raw-th><sc-raw-th>NSCA prescription<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Static<\u002Fsc-raw-td><sc-raw-td>15–90 s holds; research supports 2–5 sets of 15–90 s; suggested 4–5 sets of 30–60 s. Library stretches: 30–60 s, 4–5 reps.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Recovery sessions<\u002Fsc-raw-td><sc-raw-td>4–5 sets of 60 s bilateral static stretches of target muscle groups.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">PNF<\u002Fsc-raw-td><sc-raw-td>10 s passive, ~6 s contraction, 30 s restretch; repeat 3–4 times.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Yoga<\u002Fsc-raw-td><sc-raw-td>30–60 s holds, 3–4 reps per side.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Dynamic and med ball<\u002Fsc-raw-td><sc-raw-td>5–10 reps per side.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Mobility hurdles<\u002Fsc-raw-td><sc-raw-td>1–2 runs through the series per lead leg.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Foam rolling<\u002Fsc-raw-td><sc-raw-td>15–30 s per area; 30–60 s on very sensitive spots.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">General guideline<\u002Fsc-raw-td><sc-raw-td>At least 2–5 reps per exercise, 15–90 s holds, never to pain.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"dosing\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revDosing }}\">{{ revDosingLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"warmup\" data-screen-label=\"Warm-up and movement prep\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Warm-up and movement prep<\u002Fh2>\n\n        <h3>What a warm-up does <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption>Table 9.2 benefits of warming up (Bishop, 2003)<\u002Fsc-raw-caption>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Temperature related<\u002Fsc-raw-th><sc-raw-th>Not temperature related<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Lower muscle and joint resistance<\u002Fsc-raw-td><sc-raw-td>More blood flow to muscles<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>More oxygen released from hemoglobin and myoglobin<\u002Fsc-raw-td><sc-raw-td>Higher baseline oxygen consumption<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Faster metabolic reactions<\u002Fsc-raw-td><sc-raw-td>Post-activation potentiation<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Faster nerve conduction<\u002Fsc-raw-td><sc-raw-td>Psychological effects and preparedness<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Increased thermoregulatory strain<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>An effective warm-up usually includes aerobic exercise, stretching, and sport-specific movement. Aerobic work should last <strong>at least 5 minutes<\u002Fstrong> to raise heart rate and temperature and lower joint and tissue viscosity. A series of 6–8 dynamic movements can often fill the aerobic role.<\u002Fp>\n\n        <h3>Movement prep <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Also called a dynamic warm-up. It increases blood flow, joint mobility, and muscle flexibility and wakes up the nervous system. Tailor it to the athlete and follow this order:<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th>Technique<\u002Fsc-raw-th><sc-raw-th>Why<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:700\">SMT<\u002Fsc-raw-td><sc-raw-td>Improves blood flow and ROM without hurting performance.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:700\">Static stretching, if needed<\u002Fsc-raw-td><sc-raw-td>Only on muscles found overactive in assessment.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:700\">Dynamic stretching<\u002Fsc-raw-td><sc-raw-td>General movements like air squats and lunges, progressing in amplitude and speed.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:700\">Sport or skill rehearsal<\u002Fsc-raw-td><sc-raw-td>Dynamic work can progress into rehearsing the session's main skill (Young &amp; Behm, 2002).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption>Table 9.1 example movement prep for a general athlete<\u002Fsc-raw-caption>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Technique<\u002Fsc-raw-th><sc-raw-th>Exercises<\u002Fsc-raw-th><sc-raw-th>Variables<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">SMT<\u002Fsc-raw-td><sc-raw-td>Calves, hip flexors, upper back<\u002Fsc-raw-td><sc-raw-td>1 set; hold tender spots 30–60 s<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Static<\u002Fsc-raw-td><sc-raw-td>Wall calf stretch, kneeling hip flexor stretch, seated thoracic rotation<\u002Fsc-raw-td><sc-raw-td>2 sets; hold at first point of tension 45 s<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Dynamic<\u002Fsc-raw-td><sc-raw-td>Air squat, lunge with medicine ball rotation, multiplanar hip swings<\u002Fsc-raw-td><sc-raw-td>2 sets; 10 reps each<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>Example: a taekwondo athlete could do static hamstring stretches, then hip swings in every direction, then practice their kicks.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"warmup\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revWarmup }}\">{{ revWarmupLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"selection\" data-screen-label=\"Choosing and ordering\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Choosing and ordering exercises<\u002Fh2>\n\n        <h3>Start with a needs analysis <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Flexibility is <strong>joint-, position-, and speed-specific<\u002Fstrong> (Kurz, 2003), so training should match the sport's demands. A taekwondo athlete needs dynamic hip stretches in flexion, extension, and abduction for front, back, and side kicks. Many athletes need foundational flexibility before sport-specific work.<\u002Fp>\n        <ul>\n          <li>Analyze the demands of the sport and position.<\u002Fli>\n          <li>Assess current flexibility, such as the overhead squat with and without modifications, plus mobility testing if needed. Look for limitations, asymmetries, and imbalances.<\u002Fli>\n          <li>Tailor assessments to the athlete. An Olympic lifter could add a deep overhead squat holding a PVC pipe or empty bar.<\u002Fli>\n          <li>Factor in injury history to prevent reinjury.<\u002Fli>\n          <li>Establish baselines at the start and reassess often.<\u002Fli>\n        <\u002Ful>\n\n        <h3>Target what the assessment shows<\u002Fh3>\n        <p>Stretch muscles found overactive in movement assessment. Stretching underactive or lengthened muscles with no ROM deficit is illogical and possibly counterproductive. Select an impairment:<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0\">\n          <button type=\"button\" data-i=\"0\" sc-camel-on-click=\"{{ setImp }}\" style=\"{{ impBtn0 }}\">Feet turn out<\u002Fbutton>\n          <button type=\"button\" data-i=\"1\" sc-camel-on-click=\"{{ setImp }}\" style=\"{{ impBtn1 }}\">Knee valgus<\u002Fbutton>\n          <button type=\"button\" data-i=\"2\" sc-camel-on-click=\"{{ setImp }}\" style=\"{{ impBtn2 }}\">Anterior pelvic tilt<\u002Fbutton>\n          <button type=\"button\" data-i=\"3\" sc-camel-on-click=\"{{ setImp }}\" style=\"{{ impBtn3 }}\">Arms fall forward<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;min-height:7rem\">\n          <sc-if value=\"{{ impIs0 }}\" hint-placeholder-val=\"{{ true }}\"><div>\n            <h4 style=\"margin-top:0\">Feet turn out <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh4>\n            <p><strong>Likely overactive:<\u002Fstrong> Gastrocnemius, Soleus, Biceps femoris<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>Example static stretches:<\u002Fstrong> Wall calf stretch, Supine lateral hamstring stretch<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Hold 30–60 s at the first point of tension, then follow with dynamic work.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ impIs1 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Knee valgus <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh4>\n            <p><strong>Likely overactive:<\u002Fstrong> Gastrocnemius, Adductors, Tensor fascia latae<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>Example static stretches:<\u002Fstrong> Wall calf stretch, Standing adductor stretch, Half-kneeling hip flexor stretch<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Hold 30–60 s at the first point of tension, then follow with dynamic work.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ impIs2 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Anterior pelvic tilt <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh4>\n            <p><strong>Likely overactive:<\u002Fstrong> Hip flexor complex, Erector spinae, Latissimus dorsi<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>Example static stretches:<\u002Fstrong> Half-kneeling hip flexor stretch, Seated spinal rotation, Ball latissimus stretch<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Hold 30–60 s at the first point of tension, then follow with dynamic work.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ impIs3 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Arms fall forward <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh4>\n            <p><strong>Likely overactive:<\u002Fstrong> Latissimus dorsi, Pectoralis major and minor, Thoracic spine<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>Example static stretches:<\u002Fstrong> Ball latissimus stretch, Ball pec stretch, T-spine extension<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Hold 30–60 s at the first point of tension, then follow with dynamic work.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <h3>Make it sport-specific<\u002Fh3>\n        <p>Stretch the muscles most relevant to performance in positions that mimic the sport. Poor hamstring extensibility limits a hurdler's hip flexion, so a sequence might be SMT, static hamstring stretches, front-to-back leg swings, then actual hurdle gait practice.<\u002Fp>\n\n        <h3>Order<\u002Fh3>\n        <ul>\n          <li>Body-part order doesn't appear to matter. Encourage a consistent routine from the feet up or the neck down so nothing gets skipped; consistency drives progress.<\u002Fli>\n          <li>Consider whether one stretch makes the next more effective. With feet turning out and anterior pelvic tilt, a wall calf stretch before a standing hip flexor stretch may help target the hip flexors.<\u002Fli>\n          <li>NASM's integrated order: <strong>SMT → static (if imbalances) → dynamic → sport-specific<\u002Fstrong>.<\u002Fli>\n        <\u002Ful>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption>Table 9.7 example: feet turn out plus anterior pelvic tilt, taekwondo athlete<\u002Fsc-raw-caption>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">SMT<\u002Fsc-raw-td><sc-raw-td>Calves, quadriceps, hip flexor group<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Static<\u002Fsc-raw-td><sc-raw-td>Wall calf stretch, standing hip flexor stretch<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Dynamic<\u002Fsc-raw-td><sc-raw-td>Multiplanar lunge with rotation, leg swings<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Skill-specific<\u002Fsc-raw-td><sc-raw-td>Rapid high kicks<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Stretching on the road<\u002Fspan>At home, away games, airports, or on the bus, plan for available space, the floor surface (carpet and vinyl grip very differently when sliding into a deeper stretch), and hazards or distractions like pets and family. Supervise flexibility work when possible to check form.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"selection\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revSelection }}\">{{ revSelectionLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"tactical\" data-screen-label=\"Tactical programming\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Programming for tactical athletes<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\"><span data-src=\"nsca\">NSCA<\u002Fspan> Mobility and flexibility work isn't just warm-up and cool-down filler. It is a workout in its own right and deserves the same priority as strength training.<\u002Fp>\n\n        <h3>Training status and goals<\u002Fh3>\n        <p>No single program works for everyone. Prescription depends on the individual's needs and whether the goal is health or tactical performance. How much gets programmed depends on the athlete's status and goals, the number of sessions, available resources, and time. The facilitator must know every method before adding it, or risk injury and compromising other training.<\u002Fp>\n\n        <h3>Why timing changes the method<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Before and during a session<\u002Fh4><p>Purpose: enough ROM to perform, and less muscle stiffness (more compliance) to theoretically reduce injury risk.<\u002Fp><p style=\"margin-bottom:0\"><strong>Use dynamic stretching.<\u002Fstrong> It imitates occupational movement and builds mobility without the drops in heart rate, body temperature, circulation, force, and power linked to static stretching.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">After and between sessions<\u002Fh4><p>Purpose: maintain or improve flexibility and mobility.<\u002Fp><p style=\"margin-bottom:0\"><strong>Use static and PNF stretching<\u002Fstrong> to maintain optimal levels and address limitations. <strong>Massage or SMR<\u002Fstrong> can go during, right after, or between sessions to reduce fatigue and improve recovery, pain, and mood.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Session planner<\u002Fh3>\n        <p>Pick a situation to see what NSCA would program.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0\">\n          <button type=\"button\" data-i=\"0\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn0 }}\">Before training<\u002Fbutton>\n          <button type=\"button\" data-i=\"1\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn1 }}\">During training<\u002Fbutton>\n          <button type=\"button\" data-i=\"2\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn2 }}\">Cool-down<\u002Fbutton>\n          <button type=\"button\" data-i=\"3\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn3 }}\">Recovery session<\u002Fbutton>\n          <button type=\"button\" data-i=\"4\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn4 }}\">Short on time or no partner<\u002Fbutton>\n          <button type=\"button\" data-i=\"5\" sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn5 }}\">Unplanned call-out<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;min-height:7rem\">\n          <sc-if value=\"{{ planIs0 }}\" hint-placeholder-val=\"{{ true }}\"><div>\n            <h4 style=\"margin-top:0\">Before training <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>Dynamic warm-up, 10–15 minutes<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>Start with light aerobic activity to raise body temperature and blood flow.<\u002Fli><li>Follow with dynamic stretches that mimic job tasks: lunges, side lunges, inchworms, leg cradles.<\u002Fli><li>Mobility hurdles or a medicine ball circuit fit here, progressing from low to high intensity through full range.<\u002Fli><li>Skip long static holds and PNF here; NSCA notes they may not benefit force and power output.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ planIs1 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">During training <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>The focus of the day, with mobility slotted in<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>Main work: strength, speed, agility, or conditioning.<\u002Fli><li>Add SMR or corrective mobility for problem areas as isolated exercises between major movements, during rest between sets, or at the end as a complement.<\u002Fli><li>Massage or SMR here can reduce fatigue without hurting force output.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ planIs2 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Cool-down <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>Static or PNF stretching for flexibility<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>Target identified limitations and maintain optimal levels.<\u002Fli><li>Hold 15–90 s, 2–5 reps, to mild discomfort, never pain.<\u002Fli><li>Breathe slowly and rhythmically; avoid the Valsalva maneuver.<\u002Fli><li>Follow a logical anatomical order and stretch through multiple planes.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ planIs3 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Recovery session <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>A separate session after each workout<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>Yoga, static stretching, or PNF.<\u002Fli><li>4–5 sets of 60 s bilateral static stretches of target muscle groups is the most suitable dose to reduce passive resistance and increase flexibility.<\u002Fli><li>Massage or SMR supports recovery, pain management, and mood.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ planIs4 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Short on time or no partner <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>Pick simpler methods<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>PNF may be more effective than static stretching, but it needs a partner and substantial time per stretch.<\u002Fli><li>Static stretching still improves flexibility and is simpler and faster.<\u002Fli><li>If there's no roller, therapist, or time, SMR and massage may not be practical.<\u002Fli><li>Keep the dynamic warm-up; it protects session quality.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ planIs5 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">Unplanned call-out <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4><p><strong>No warm-up is possible<\u002Fstrong><\u002Fp>\n            <ul style=\"margin-bottom:0\"><li>Firefighter alarms, returning fire, and forced entry don't allow preparation.<\u002Fli><li>Performance and injury risk then depend on the flexibility and mobility the athlete already has.<\u002Fli><li>This is why NSCA treats mobility as a workout in its own right and as much a priority as strength training.<\u002Fli><\u002Ful>\n          <\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <h3>Real-world constraints<\u002Fh3>\n        <ul>\n          <li><strong>Time, equipment, personnel.<\u002Fstrong> PNF may beat static stretching for flexibility but needs a partner and a lot of time per stretch. Static still works and is simpler and faster.<\u002Fli>\n          <li><strong>Environment.<\u002Fstrong> There may not be time, equipment, or staff for massage or SMR.<\u002Fli>\n          <li><strong>Needs analysis.<\u002Fstrong> Choose the style for the session at hand while accounting for upcoming sessions and work schedules.<\u002Fli>\n          <li><strong>Overuse.<\u002Fstrong> Training errors from overuse are a primary injury risk factor. Planning work, rest, and training sets the frequency, intensity, volume, and modality for recovery and performance.<\u002Fli>\n          <li><strong>No warm-up on the job.<\u002Fstrong> Alarm callouts, returning fire, and forced entry happen without warning. Baseline flexibility and mobility let tactical athletes respond well, lower injury risk, and recover quickly.<\u002Fli>\n        <\u002Ful>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--blue);background:var(--blue-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">NSCA key point<\u002Fspan>A tactical program must cover every fitness component, but how much attention each gets depends on the needs analysis: current physical readiness, the physical demands of work and life, available time, equipment, and personnel, and individual health and performance goals.<\u002Fdiv>\n\n        <h3>NSCA guidelines for increasing and maintaining flexibility<\u002Fh3>\n        <ul>\n          <li>Do a general warm-up first to raise body temperature and blood flow.<\u002Fli>\n          <li>Cover all major muscle groups, especially the low back, hips, quadriceps, hamstrings, and calves.<\u002Fli>\n          <li>Follow a logical anatomical order, such as lower legs up to upper extremities or the reverse, and stretch in several planes at each joint.<\u002Fli>\n          <li>Do at least 2–5 reps per exercise with 15–90 s holds while comfortable. Aim for mild discomfort, never pain.<\u002Fli>\n          <li>Breathe slowly and rhythmically during holds to release tension and avoid the Valsalva maneuver and the blood pressure spike it causes.<\u002Fli>\n          <li>Do a dynamic warm-up before moderate to vigorous activity, add mobility work within or at the end of the workout for problem areas, and finish with static stretching in the cool-down for overall flexibility.<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:.92rem;color:var(--muted)\">Conclusion: firefighters, police officers, first responders, and soldiers all need to be supple to do their jobs. An efficient routine accounts for the athlete's status and demands, individual and program goals, and the physiological and kinesiological factors that affect flexibility.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"tactical\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revTactical }}\">{{ revTacticalLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">Review<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Reconcile the two books, drill the numbers, then test yourself.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"conflicts\" data-screen-label=\"Where the texts disagree\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>Where the texts disagree<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">When a question could come from either book, this is where answers diverge.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Topic<\u002Fsc-raw-th><sc-raw-th style=\"box-shadow:inset 3px 0 0 var(--blue)\">NSCA<\u002Fsc-raw-th><sc-raw-th style=\"box-shadow:inset 3px 0 0 var(--red)\">NASM<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Flexibility<\u002Fsc-raw-td><sc-raw-td>Muscles and tendons moving through full ROM at one joint<\u002Fsc-raw-td><sc-raw-td>Normal soft tissue extensibility allowing full joint ROM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Mobility<\u002Fsc-raw-td><sc-raw-td>Coordination and efficiency of multi-joint movement through ROM, without compensation<\u002Fsc-raw-td><sc-raw-td>Joint moving through full ROM with control and stability (also task ability, or DOF)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Static before activity<\u002Fsc-raw-td><sc-raw-td>May cause stretch-induced strength loss; put it in the cool-down<\u002Fsc-raw-td><sc-raw-td>Under 60 s per muscle, then dynamic work: no impairment; use in movement prep for overactive muscles<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Static and injury<\u002Fsc-raw-td><sc-raw-td>No conclusive evidence it reduces injury<\u002Fsc-raw-td><sc-raw-td>Evidence it can reduce lower-body muscle and tendon injuries in fast, change-of-direction sports<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Static dose<\u002Fsc-raw-td><sc-raw-td>15–90 s; suggested 4–5 sets of 30–60 s; recovery 4–5 × 60 s<\u002Fsc-raw-td><sc-raw-td>At least 30 s; 30–60 s; 1–3 sets<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">PNF names<\u002Fsc-raw-td><sc-raw-td>Hold–relax = isometric. Contract–relax = concentric through ROM. Hold–relax with agonist contraction is most effective.<\u002Fsc-raw-td><sc-raw-td>HR = isotonic resisted by a third party. CR = self-applied isometric. CRAC is the featured method.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">PNF dose<\u002Fsc-raw-td><sc-raw-td>10 s passive, 6 s contraction, 30 s restretch; 3–4 reps<\u002Fsc-raw-td><sc-raw-td>40–70% MVIC; hold new range 20–30 s, 3–5 reps; 2–5 sets, 2–4 days/week<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">PNF mechanism<\u002Fsc-raw-td><sc-raw-td>Agonist activation causes reciprocal inhibition of the antagonist<\u002Fsc-raw-td><sc-raw-td>Autogenic inhibition, thixotropy, stretch tolerance (reciprocal inhibition for CRAC); GTO role doubtful<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Myofascial name and mechanism<\u002Fsc-raw-td><sc-raw-td>Myofascial release: breaks adhesions; friction makes fascia more fluid (thixotropy)<\u002Fsc-raw-td><sc-raw-td>SMT: \"release\" dropped; effects mostly neurological (tone, reflexes, pain tolerance)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Rolling dose<\u002Fsc-raw-td><sc-raw-td>15–30 s per area; 30–60 s on sensitive spots; beginners rest a day between<\u002Fsc-raw-td><sc-raw-td>30–60 s; tender spots at least 30 s; no more than 120 s per muscle; daily is fine<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Dynamic dose<\u002Fsc-raw-td><sc-raw-td>5–10 reps per side; 10–15 min dynamic warm-up<\u002Fsc-raw-td><sc-raw-td>1–2 sets of 10–15 reps, 3–10 exercises; 6–10 min per session<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Aerobic warm-up<\u002Fsc-raw-td><sc-raw-td>5–10 min general warm-up plus dynamic routine<\u002Fsc-raw-td><sc-raw-td>At least 5 min; 6–8 dynamic moves can replace it<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Session order<\u002Fsc-raw-td><sc-raw-td>Dynamic warm-up → main work (SMR or correctives between sets) → static or PNF cool-down → separate recovery session<\u002Fsc-raw-td><sc-raw-td>SMT → static (overactive only) → dynamic → sport-specific, all before the main work<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Ballistic<\u002Fsc-raw-td><sc-raw-td>Not recommended for tactical athletes<\u002Fsc-raw-td><sc-raw-td>Mentioned only as not impairing performance the way long static holds can<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">Typos to watch for<\u002Fspan>NSCA's key terms list prints \"strength-induced strength loss\"; the chapter body correctly calls it stretch-induced strength loss. NASM cites \"Neeham et al., 2009\" in the text; the reference is Needham.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"conflicts\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revConflicts }}\">{{ revConflictsLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"numbers\" data-screen-label=\"Numbers drill\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Numbers drill<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Hide the values, then click each blurred value to check your recall.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleNums }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer\">{{ numsLabel }}<\u002Fbutton>\n        <div data-nums=\"{{ numsMode }}\" style=\"margin-top:.8rem\">\n          <div style=\"overflow-x:auto;margin:0 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Fact<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th>Source<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td>Sarcomere stretch before injury<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">150% of resting length<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NSCA<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Joint stiffness: capsule &amp; ligaments / fascia / tendons / skin<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel- <sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>CRAC hold and reps<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">20–30 s, 3–5 reps<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>PNF-style sets, contractions, frequency (Kurz)<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">2–5 sets, 3–5 contractions, 2–4 days/week<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Weekly stretching volume floor and ceiling<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">at least 5 min; little added past 10 min<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Dynamic routine that improved flexibility<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">6–12 min<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Likely optimal stretching frequency<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">once daily, 5–6 days/week<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Aerobic warm-up minimum<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">5 min (or 6–8 dynamic moves)<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Vibration roller reps / duration / total<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">3–6 / 30–120 s / 6–12 min<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Percussion reps / duration / total<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">1–2 / 30–60 s / 3–5 min<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>IASTM application that increased dorsiflexion<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">5 min<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Percussion survey size<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">425 professionals<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Stick Mobility<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">1 set, 8–10 reps, 1–2 s hold, 3–10 exercises<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>Table 9.1 static dose<\u002Fsc-raw-td><sc-raw-td><span data-num=\"1\" sc-camel-on-click=\"{{ revealNum }}\">2 sets, 45 s at first point of tension<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>NASM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"numbers\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revNumbers }}\">{{ revNumbersLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"sequences\" data-screen-label=\"Put it in order\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Put it in order<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Click the steps in the correct order. A wrong pick doesn't count.<\u002Fp>\n        <sc-for list=\"{{ orderGames }}\" as=\"g\" hint-placeholder-count=\"8\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:1rem 0\">\n            <h4 style=\"margin:0\">{{ g.t }}<\u002Fh4>\n            <div style=\"display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0\">\n              <sc-for list=\"{{ g.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <button type=\"button\" data-gi=\"{{ g.gi }}\" data-step=\"{{ s.step }}\" sc-camel-on-click=\"{{ placeStep }}\" style=\"{{ s.style }}\">{{ s.step }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <ol style=\"margin:.4rem 0;padding-left:1.4rem;min-height:1.5rem\">\n              <sc-for list=\"{{ g.placedList }}\" as=\"p\" hint-placeholder-count=\"0\"><li>{{ p.label }}<\u002Fli><\u002Fsc-for>\n            <\u002Fol>\n            <div style=\"display:flex;gap:.8rem;align-items:center;flex-wrap:wrap\">\n              <span style=\"{{ g.statusStyle }}\">{{ g.status }}<\u002Fspan>\n              <button type=\"button\" data-gi=\"{{ g.gi }}\" sc-camel-on-click=\"{{ resetOrder }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:.45rem .9rem;cursor:pointer\">Reset<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button type=\"button\" data-sec=\"sequences\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revSequences }}\">{{ revSequencesLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"flashcards\" data-screen-label=\"Flashcards\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Flashcards<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Click a card to flip it. Cards you mark as known are remembered in this browser.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0\">\n          <sc-for list=\"{{ deckFilters }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button type=\"button\" data-k=\"{{ f.key }}\" sc-camel-on-click=\"{{ setCardTopic }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:.8rem;margin:1rem 0\">\n          <div sc-camel-on-click=\"{{ flipCard }}\" style=\"perspective:1200px;min-height:230px;cursor:pointer\">\n            <div style=\"{{ cardFlipStyle }}\">\n              <div style=\"position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;justify-content:center;overflow:auto\">\n                <div style=\"font-family:'Anybody',Arial,sans-serif;font-variation-settings:'wdth' 75;font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.05\">{{ cardTerm }}<\u002Fdiv>\n                <div style=\"font-size:.85rem;color:var(--muted);margin-top:.6rem\">{{ cardHint }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;justify-content:center;overflow:auto\">\n                <p style=\"margin:0;font-size:1.1rem\">{{ cardDef }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between\">\n            <div style=\"display:flex;gap:.4rem;flex-wrap:wrap\">\n              <button type=\"button\" sc-camel-on-click=\"{{ cardPrev }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:.45rem .9rem;cursor:pointer\">Previous<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ cardNext }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer\">Next<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:.6rem;align-items:center;flex-wrap:wrap\">\n              <label style=\"font-size:.9rem;display:flex;gap:.3rem;align-items:center\"><input type=\"checkbox\" checked=\"{{ onlyUnknown }}\" sc-camel-on-change=\"{{ toggleOnlyUnknown }}\"> Only cards I don't know<\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleKnown }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:.45rem .9rem;cursor:pointer\">{{ knownLabel }}<\u002Fbutton>\n              <span style=\"font-size:.9rem;color:var(--muted)\">{{ cardCount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <details style=\"margin:1rem 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem\">\n          <summary>Full glossary<\u002Fsummary>\n          <input type=\"search\" value=\"{{ glossQ }}\" sc-camel-on-change=\"{{ setGlossQ }}\" placeholder=\"Filter terms\" style=\"font:inherit;padding:.45rem .7rem;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--card);color:var(--ink);margin-top:.6rem;width:100%\">\n          <dl style=\"margin:.6rem 0 0\">\n            <sc-for list=\"{{ glossRows }}\" as=\"t\" hint-placeholder-count=\"10\">\n              <div>\n                <dt>{{ t.term }}<\u002Fdt>\n                <dd>{{ t.def }} <span style=\"font-size:.85rem;color:var(--muted)\">({{ t.group }})<\u002Fspan><\u002Fdd>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdl>\n        <\u002Fdetails>\n        <button type=\"button\" data-sec=\"flashcards\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revFlashcards }}\">{{ revFlashcardsLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"quiz\" data-screen-label=\"Practice quiz\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Practice quiz<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Questions cover both chapters and include NSCA's four end-of-chapter study questions. Your results break down by category at the end.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0\">\n          <sc-for list=\"{{ quizFilters }}\" as=\"f\" hint-placeholder-count=\"9\">\n            <button type=\"button\" data-k=\"{{ f.key }}\" sc-camel-on-click=\"{{ setQuizCat }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:1.1rem 1.2rem;margin:1rem 0\">\n          <sc-if value=\"{{ quizActive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:.88rem;color:var(--muted)\">\n                <span>{{ quizMeta }}<\u002Fspan>\n                <span><span data-src=\"{{ quizSrc }}\">{{ quizSrcLabel }}<\u002Fspan> {{ quizScore }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:1.14rem;font-weight:700;margin:.5rem 0 .8rem;max-width:none\">{{ quizText }}<\u002Fp>\n              <div style=\"display:grid;gap:.45rem\">\n                <sc-for list=\"{{ quizOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" data-k=\"{{ o.k }}\" sc-camel-on-click=\"{{ pickQuiz }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ quizAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:.8rem;padding:.7rem .85rem;border-radius:6px;background:var(--paper)\">\n                  <span style=\"{{ quizVerdictStyle }}\">{{ quizVerdict }}<\u002Fspan> {{ quizExplain }}\n                  <div style=\"margin-top:.7rem\"><button type=\"button\" sc-camel-on-click=\"{{ nextQuiz }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer\">{{ quizNextLabel }}<\u002Fbutton><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <p style=\"font-size:1.14rem;font-weight:700;margin:.2rem 0 .8rem\">{{ quizTotal }}<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;margin:.8rem 0\">\n                <sc-for list=\"{{ quizBreakdown }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <div style=\"border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;background:var(--paper)\">\n                    <b style=\"display:block\">{{ b.label }}<\u002Fb>{{ b.score }}\n                    <div style=\"height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:.3rem\"><i style=\"{{ b.barStyle }}\"><\u002Fi><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"font-size:.92rem\">{{ quizAdvice }}<\u002Fp>\n              <div style=\"display:flex;gap:.5rem;flex-wrap:wrap\">\n                <button type=\"button\" sc-camel-on-click=\"{{ retakeQuiz }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer\">Retake<\u002Fbutton>\n                <sc-if value=\"{{ hasMissed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ retakeMissed }}\" style=\"font:inherit;font-size:.93rem;font-weight:700;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:.45rem .9rem;cursor:pointer\">{{ missedCount }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"quiz\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revQuiz }}\">{{ revQuizLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"takeaways\" data-screen-label=\"Key takeaways\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Key takeaways<\u002Fh2>\n        <ul>\n          <li><strong>Definitions differ.<\u002Fstrong> NSCA: flexibility is single-joint muscle and tendon range; mobility is coordinated, efficient multi-joint movement. NASM: flexibility is tissue extensibility; mobility is controlled, stable joint range.<\u002Fli>\n          <li><strong>Range is limited by structure and nerves.<\u002Fstrong> Capsule and ligaments give 47% of joint stiffness and fascia 41%, but fascia is the elastic, trainable part. Receptors, especially spindles and GTOs, decide how much range the nervous system allows.<\u002Fli>\n          <li><strong>Mechanisms are still debated.<\u002Fstrong> Autogenic and reciprocal inhibition are classic explanations, but stretch tolerance, disfacilitation, and thixotropy likely explain much of the gain.<\u002Fli>\n          <li><strong>Imbalances cascade.<\u002Fstrong> Pattern overload and the cumulative injury cycle create imbalances, which lead to altered reciprocal inhibition, synergistic dominance, joint dysfunction, and poor neuromuscular efficiency.<\u002Fli>\n          <li><strong>Timing picks the method.<\u002Fstrong> Dynamic before and during work. Static and PNF after or between sessions (NSCA), or short static holds on overactive muscles inside a full movement prep (NASM). SMT fits almost anywhere.<\u002Fli>\n          <li><strong>Dose is individual.<\u002Fstrong> Guidelines exist for sets, reps, intensity, frequency, and volume, but the dose–response is individual. A single short stretch raises range acutely; lasting change takes consistent training.<\u002Fli>\n          <li><strong>Tactical athletes can't always warm up.<\u002Fstrong> Program mobility as its own priority, respect time, equipment, and partner constraints, and base everything on a needs analysis.<\u002Fli>\n        <\u002Ful>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"takeaways\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revTakeaways }}\">{{ revTakeawaysLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <footer style=\"border-top:2px solid var(--rule);padding:1.4rem 0 3rem;color:var(--muted);font-size:.9rem\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <p>Built from your uploaded module document combining NSCA's <em>Essentials of Tactical Strength and Conditioning<\u002Fem> flexibility chapter and NASM's <em>Essentials of Sports Performance Training<\u002Fem> Chapter 9, with chapter references cited inline by author and year. Content is summarized for personal study.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Study options&quot;},&quot;showContents&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Study options&quot;},&quot;showHighlights&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Study options&quot;}}\">\nconst GROUPS = {\n  static: { t: \"Static stretches\", s: \"nsca\", note: \"30–60 s per side, 4–5 reps, to the point of discomfort.\", f: \"static\" },\n  pnf: { t: \"PNF partner stretches\", s: \"nsca\", note: \"Use hold–relax, contract–relax, or hold–relax with agonist contraction. Stretch to discomfort, never pain.\", f: \"pnf\" },\n  hurdles: { t: \"Mobility hurdles\", s: \"nsca\", note: \"4–6 hurdles 2 ft (61 cm) apart, alternating low (mid-thigh) and high (waist). Don't let the knee drift sideways when stepping over.\", f: \"mobility\" },\n  medball: { t: \"Medicine ball circuit\", s: \"nsca\", note: \"Start every move in an athletic position: half squat, feet hip-width, shoulders back, spine neutral. Eyes follow the ball.\", f: \"mobility\" },\n  yoga: { t: \"Yoga\", s: \"nsca\", note: \"Hold 30–60 s, 3–4 reps per side, with attention to breathing and alignment.\", f: \"yoga\" },\n  dyn: { t: \"Dynamic stretches\", s: \"nsca\", note: \"Controlled, occupation-specific movements before or during the session.\", f: \"dynamic\" },\n  roll: { t: \"Foam rolling\", s: \"nsca\", note: \"Roll each area 15–30 s; hold very sensitive spots 30–60 s. Avoid joints and bony areas.\", f: \"roll\" },\n  sa: { t: \"Static and active stretches\", s: \"nasm\", note: \"Handout images. Static: 30–60 s at first tension. Active: 1–2 s holds for 5–10 reps.\", f: \"static\" },\n  dyn2: { t: \"Dynamic stretches\", s: \"nasm\", note: \"Handout 9.4 images. 1–2 sets of 10–15 reps.\", f: \"dynamic\" },\n  smt: { t: \"Self-myofascial techniques\", s: \"nasm\", note: \"Handout 9.1 images. 1 set, 30–60 s; hold tender spots at least 30 s; no more than 120 s per muscle.\", f: \"roll\" },\n  perc: { t: \"Percussion\", s: \"nasm\", note: \"Handout 9.2 images, practitioner-applied. 1–2 reps of 30–60 s; 3–5 min total.\", f: \"perc\" },\n  stick: { t: \"Stick Mobility\", s: \"nasm\", note: \"Video list. 1 set, 8–10 reps, 1–2 s end-range hold, 3–10 exercises.\", f: \"stick\" },\n  assist: { t: \"Assisted stretches\", s: \"nasm\", note: \"Video list. CRAC: contract at 40–70% MVIC, hold new range 20–30 s, 3–5 reps.\", f: \"pnf\" }\n};\n\nconst LIB = [\n [\"static\",\"Standing quadriceps stretch\",\"Quadriceps\",\"Standing, bring one foot toward the hips and hold the ankle. Draw the heel toward the buttocks and gently press the hip forward.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Lying quadriceps stretch\",\"Quadriceps\",\"Lie on your side, bend the knee, and hold the ankle. Draw the heel slightly toward the buttocks and gently press the hip forward.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Standing hamstring stretch\",\"Hamstrings\",\"Step one foot forward, front knee slightly bent, back leg straight. Pull the front toes toward the shin and hinge forward with a neutral spine. Straighten the front leg to progress.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Seated hamstring stretch\",\"Hamstrings\",\"Sit with one leg straight and the other foot against its inner thigh. Bend forward along the straight leg to the point of discomfort.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Seated adductor stretch\",\"Adductors, groin\",\"Sit with the soles together. Hands on the inner lower legs and forearms across the inner knees; gently press down.\",\"30–60 s, 4–5 reps\"],\n [\"static\",\"Lateral adductor stretch\",\"Adductors, groin\",\"Wide stance, toes forward. Bend one knee and lower toward that side while the other leg stays straight.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Gastrocnemius and soleus stretch\",\"Calf\",\"Staggered stance, front knee bent, rear leg straight with the heel flat. Lean forward until the rear calf stretches. Progression: bend the back knee and sink with the heel still down.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Pretzel stretch\",\"Hip, glutes, low back\",\"Supine with the right foot flat. Cross the left ankle over the lower third of the right thigh, hold the left knee, and pull it toward the opposite shoulder. Can't lift the leg? Do it seated.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Forward lunge (static)\",\"Hip flexors\",\"Step far forward, lower the back knee to the floor with the front knee at 90°. Stay upright and ease the hips forward until the front of the rear hip stretches.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Knee to chest\",\"Hip, low back\",\"Supine with one leg straight. Hold the other leg just below the knee and pull it toward the chest.\",\"30–60 s per leg, 4–5 reps\"],\n [\"static\",\"Lateral neck flexion\",\"Neck\",\"Seated or standing, tilt the head to one side until the opposite side stretches.\",\"30–60 s per side, 4–5 reps\"],\n [\"static\",\"Lateral neck rotation\",\"Neck\",\"Seated or standing, turn the head as if looking over the shoulder until the opposite side stretches.\",\"30–60 s per side, 4–5 reps\"],\n [\"static\",\"Anterior shoulder and chest stretch\",\"Shoulders, chest\",\"Standing, clasp the hands behind you with arms straight. Lift the hands gently while pushing the chest forward.\",\"30–60 s, 4–5 reps\"],\n [\"static\",\"Cross-arm stretch\",\"Shoulders\",\"Reach one arm across the body, keeping that shoulder down. Use the other arm to pull it gently further.\",\"30–60 s per arm, 4–5 reps\"],\n [\"static\",\"Side bend\",\"Torso, lats\",\"Standing, clasp the hands overhead with arms straight and bend to one side.\",\"30–60 s per side, 4–5 reps\"],\n [\"pnf\",\"Hamstring stretch (PNF)\",\"Hamstrings\",\"Athlete supine, legs straight, palms down; one leg raised passively to discomfort. Partner straddles the grounded leg, one hand on the raised foot and one just above its knee.\",\"3–4 reps of chosen technique\"],\n [\"pnf\",\"Calf stretch (PNF)\",\"Calf\",\"Athlete seated, legs straight. Partner sits at the feet or rests the leg on their shoulder, hands on the upper third of the feet.\",\"3–4 reps of chosen technique\"],\n [\"pnf\",\"Groin stretch (PNF)\",\"Adductors\",\"Athlete in butterfly position. Partner kneels behind with a hand on the inside of each knee.\",\"3–4 reps of chosen technique\"],\n [\"pnf\",\"Quadriceps and hip flexor stretch (PNF)\",\"Quadriceps, hip flexors\",\"Athlete prone, legs straight. Partner kneels between the thighs with one hand on the lower third of the stretched thigh.\",\"3–4 reps of chosen technique\"],\n [\"pnf\",\"Chest stretch (PNF)\",\"Chest\",\"Athlete sits or kneels, arms out to the sides, hands laced behind the head. Partner stands behind with a hand just above each elbow.\",\"3–4 reps of chosen technique\"],\n [\"pnf\",\"Shoulder stretch (PNF)\",\"Shoulders\",\"Athlete sits or kneels with arms straight behind. Partner stands behind holding each wrist.\",\"3–4 reps of chosen technique\"],\n [\"hurdles\",\"Forward over and under\",\"Hips, whole lower body\",\"Face the low hurdle, drive a knee high, and step over so the heel passes straight over and lands flat; bring the trail leg over. In one motion, squat below the high hurdle, step through, and move under until the trail leg returns. Same lead leg for the series, then switch.\",\"1–2 series per lead leg\"],\n [\"hurdles\",\"Backward over and under\",\"Hips, whole lower body\",\"Back to the low hurdle, lift a knee high, lean slightly forward, and reach back over with the heel; bring the trail leg over. Squat and move backward under the high hurdle. Same lead leg for the series, then switc
