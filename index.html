document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(--card) !important;color:var(--ink) !important;border-color:var(--line-strong) !important}\n[data-theme=\"dark\"] input::placeholder{color:var(--line-strong)}\n/* SVG presentation attributes cannot read custom properties, so remap them here */\n[data-theme=\"dark\"] [fill=\"#FFFFFF\"]{fill:var(--card)}\n[data-theme=\"dark\"] [fill=\"#E9EEF4\"]{fill:var(--surface)}\n[data-theme=\"dark\"] [fill=\"#DCE8F3\"]{fill:var(--blue-soft)}\n[data-theme=\"dark\"] [fill=\"#F6E9CF\"]{fill:var(--amber-soft)}\n[data-theme=\"dark\"] [fill=\"#F4DCDF\"],[data-theme=\"dark\"] [fill=\"#F6E3E7\"]{fill:var(--red-soft)}\n[data-theme=\"dark\"] [fill=\"#18202E\"]{fill:var(--ink)}\n[data-theme=\"dark\"] [fill=\"#566174\"]{fill:var(--muted)}\n[data-theme=\"dark\"] [fill=\"#2A5F93\"]{fill:var(--blue)}\n[data-theme=\"dark\"] [fill=\"#A6283F\"]{fill:var(--red)}\n[data-theme=\"dark\"] [stroke=\"#18202E\"]{stroke:var(--rule)}\n[data-theme=\"dark\"] [stroke=\"#9AA6B8\"]{stroke:var(--line-strong)}\n[data-theme=\"dark\"] [stroke=\"#2A5F93\"]{stroke:var(--blue)}\n[data-theme=\"dark\"] [stroke=\"#A6283F\"]{stroke:var(--red)}\n[data-theme=\"dark\"] [stroke=\"#9A6606\"]{stroke:var(--amber-ink)}\n[data-theme=\"dark\"] [stroke=\"#FFFFFF\"]{stroke:var(--card)}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:\"Atkinson Hyperlegible\",\"Segoe UI\",Roboto,Arial,sans-serif;font-size:17px;line-height:1.62}\n*{box-sizing:border-box}\nh2,h3,h4{line-height:1.14;margin:0}\nh2{font-family:\"Anybody\",\"Arial Narrow\",Arial,sans-serif;font-variation-settings:\"wdth\" 72;font-weight:780;font-size:clamp(1.9rem,4.2vw,2.6rem);letter-spacing:-.005em;margin:0 0 .9rem}\nh3{font-size:1.28rem;font-weight:700;margin:2.2rem 0 .6rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}\nh4{font-size:1.05rem;font-weight:700;margin:1.4rem 0 .4rem}\np{margin:.2rem 0 .9rem;max-width:68ch;text-wrap:pretty}\nul,ol{padding-left:1.25rem;margin:.6rem 0 1rem}\nli{margin:.25rem 0;max-width:68ch;text-wrap:pretty}\na{color:var(--blue);text-underline-offset:.18em}\na:hover{color:var(--blue-deep)}\ntable{border-collapse:collapse;width:100%;font-size:.94rem;line-height:1.45}\ncaption{text-align:left;font-weight:700;padding:.7rem .8rem .2rem;caption-side:top}\nth,td{text-align:left;vertical-align:top;padding:.55rem .8rem;border-bottom:1px solid var(--line)}\nthead th{border-bottom:2px solid var(--rule);font-weight:700}\ntbody tr:last-child td{border-bottom:0}\ntd ul{margin:0;padding-left:1rem}\nfigcaption{font-size:.9rem;color:var(--muted);margin-top:.5rem;max-width:68ch}\ndt{font-weight:700;margin-top:.7rem}\ndd{margin:.1rem 0 0;max-width:68ch}\nsummary{cursor:pointer;font-weight:700}\nmark{background:transparent;color:inherit}\nmark[data-hl=\"exam\"]{background:#FFE9A8;color:#18202E;padding:0 .12em;border-radius:2px}\nmark[data-hl=\"fuzzy\"]{background:#D8E9FF;color:#18202E;padding:0 .12em;border-radius:2px}\nmark[data-hl=\"clash\"]{background:#FFD9DE;color:#18202E;padding:0 .12em;border-radius:2px}\n[data-src]{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:.12rem .45rem;border-radius:4px;border:1.5px solid currentColor;line-height:1.3;white-space:nowrap;vertical-align:middle}\n[data-src=\"nsca\"]{color:var(--blue);background:var(--blue-soft)}\n[data-src=\"nasm\"]{color:var(--red);background:var(--red-soft)}\n[data-src=\"both\"]{color:var(--ink);background:var(--card);border-color:var(--line-strong)}\n[data-nums=\"on\"] [data-num]{filter:blur(6px);background:var(--line);user-select:none;border-radius:3px}\n[data-nums=\"on\"] [data-num][data-shown=\"1\"]{filter:none;background:var(--green-soft)}\n[data-num]{cursor:pointer;padding:0 .15rem;border-radius:3px}\n@media (max-width:900px){[data-shell]{grid-template-columns:minmax(0,1fr) !important}[data-toc]{position:static !important;max-height:none !important}}\n[data-notes=\"off\"] [data-note]{display:none}\n[data-note-field]:empty:before{content:attr(data-placeholder);color:var(--line-strong)}\n[data-note-field]:focus{box-shadow:inset 0 -2px 0 var(--amber)}\n[data-hlbar]{position:fixed;z-index:60;display:flex;gap:.3rem;align-items:center;padding:.35rem;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.18)}\n[data-hlbar] button{font:inherit;font-size:.8rem;font-weight:700;line-height:1;border-radius:999px;padding:.3rem .55rem;cursor:pointer;border:1.5px solid transparent;color:#18202E}\n[data-hlbar] button[data-erase]{background:var(--card);color:var(--muted);border-color:var(--line-strong)}\n[data-tocvis=\"off\"] [data-toc]{display:none}\n[data-tocvis=\"off\"] [data-shell]{grid-template-columns:minmax(0,1fr)}\n[data-marks=\"off\"] mark[data-hl]{background:transparent}\n\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-notes=\"{{ notesMode }}\" data-tocvis=\"{{ tocMode }}\" data-marks=\"{{ marksMode }}\" data-theme=\"{{ themeMode }}\" style=\"background:var(--paper);color:var(--ink);min-height:100%\">\n\n  \n\n  <sc-if value=\"{{ hlBarOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-hlbar=\"1\" style=\"{{ hlBarStyle }}\" sc-camel-on-mouse-down=\"{{ keepSelection }}\">\n      <button type=\"button\" data-hl=\"exam\" sc-camel-on-click=\"{{ applyHl }}\" style=\"background:#FFE9A8\">Exam<\u002Fbutton>\n      <button type=\"button\" data-hl=\"fuzzy\" sc-camel-on-click=\"{{ applyHl }}\" style=\"background:#D8E9FF\">Fuzzy<\u002Fbutton>\n      <button type=\"button\" data-hl=\"clash\" sc-camel-on-click=\"{{ applyHl }}\" style=\"background:#FFD9DE\">Clash<\u002Fbutton>\n      <button type=\"button\" data-erase=\"1\" sc-camel-on-click=\"{{ eraseHl }}\">Erase<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"border-bottom:2px solid var(--rule);padding:2.4rem 0 2.2rem;overflow:hidden\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap\">\n        <p style=\"font-size:1rem;color:var(--muted);margin:0\">Study guide for the combined flexibility module<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"font:inherit;font-size:.88rem;font-weight:700;background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:999px;padding:.35rem .85rem;cursor:pointer;white-space:nowrap\">{{ themeLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Anybody','Arial Narrow',Arial,sans-serif;font-weight:850;font-size:clamp(2.7rem,9.4vw,7.2rem);line-height:.9;letter-spacing:-.01em;margin:.2rem 0 1.4rem;font-variation-settings:'wdth' 80\">Flexibility<\u002Fh1>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,4vw,48px);align-items:start\">\n        <div>\n          <p>This guide condenses both chapters in the module into one place: what limits range of motion, which nervous-system and tissue mechanisms change it, why movement breaks down, every technique and its dose, and how to program it for tactical and sport athletes.<\u002Fp>\n          <p>The two textbooks don't always agree. Each claim is tagged with its source so you can answer the way each text expects.<\u002Fp>\n          <div style=\"display:grid;gap:.6rem;margin-top:1rem\">\n            <div style=\"display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:baseline;font-size:.96rem\"><span data-src=\"nsca\">NSCA<\u002Fspan><span><em>Essentials of Tactical Strength and Conditioning<\u002Fem>, Flexibility and Mobility Exercise Techniques and Programming (Ch. 12 in your edition)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:baseline;font-size:.96rem\"><span data-src=\"nasm\">NASM<\u002Fspan><span><em>Essentials of Sports Performance Training<\u002Fem>, Ch. 9: Flexibility Training for Sports Performance<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:1.2rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem\">\n            <div style=\"font-weight:700;margin-bottom:.4rem\">Highlighter key<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.9rem\">\n              <span><mark data-hl=\"exam\">Exam-likely<\u002Fmark><\u002Fspan>\n              <span><mark data-hl=\"fuzzy\">Still confusing<\u002Fmark><\u002Fspan>\n              <span><mark data-hl=\"clash\">NSCA vs NASM clash<\u002Fmark><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:.85rem;color:var(--muted);margin:.5rem 0 0\">Select any text on the page and a highlighter bar appears. Marks save in this browser, so they work in a downloaded copy too.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:1rem\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap\">\n            <label style=\"font-weight:700\">Take the tissue into a stretch<\u002Flabel>\n            <div style=\"display:inline-flex;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden\">\n              <button type=\"button\" sc-camel-on-click=\"{{ setSlow }}\" style=\"{{ slowBtnStyle }}\">Slow hold<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ setFast }}\" style=\"{{ fastBtnStyle }}\">Fast bounce<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 420 220\" style=\"display:block;width:100%;height:auto;margin:.4rem 0\">\n            <rect x=\"44\" y=\"22\" width=\"126\" height=\"170\" fill=\"#E9EEF4\"><\u002Frect>\n            <rect x=\"170\" y=\"22\" width=\"90\" height=\"170\" fill=\"#DCE8F3\"><\u002Frect>\n            <rect x=\"260\" y=\"22\" width=\"79.2\" height=\"170\" fill=\"#F6E9CF\"><\u002Frect>\n            <rect x=\"339.2\" y=\"22\" width=\"64.8\" height=\"170\" fill=\"#F4DCDF\"><\u002Frect>\n            <text x=\"107\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#566174\">Slack<\u002Ftext>\n            <text x=\"215\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#566174\">First tension<\u002Ftext>\n            <text x=\"299\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#566174\">Discomfort<\u002Ftext>\n            <text x=\"371\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#566174\">Pain<\u002Ftext>\n            <line x1=\"44\" y1=\"192\" x2=\"404\" y2=\"192\" stroke=\"var(--ink)\" stroke-width=\"1.5\"><\u002Fline>\n            <line x1=\"44\" y1=\"192\" x2=\"44\" y2=\"22\" stroke=\"var(--ink)\" stroke-width=\"1.5\"><\u002Fline>\n            <text x=\"224\" y=\"214\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Muscle length →<\u002Ftext>\n            <text x=\"14\" y=\"107\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\" transform=\"rotate(-90 14 107)\">Tension →<\u002Ftext>\n            <path d=\"{{ passivePath }}\" fill=\"none\" stroke=\"{{ passiveStroke }}\" stroke-width=\"{{ passiveWidth }}\" stroke-dasharray=\"{{ passiveDash }}\"><\u002Fpath>\n            <path d=\"{{ reflexPath }}\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"3\"><\u002Fpath>\n            <line x1=\"{{ dotX }}\" x2=\"{{ dotX }}\" y1=\"192\" y2=\"22\" stroke=\"var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"><\u002Fline>\n            <circle cx=\"{{ dotX }}\" cy=\"{{ dotY }}\" r=\"7\" fill=\"var(--card)\" stroke=\"{{ dotStroke }}\" stroke-width=\"3\"><\u002Fcircle>\n          <\u002Fsvg>\n          \n          <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ x }}\" sc-camel-on-change=\"{{ setX }}\" style=\"width:100%;accent-color:var(--red)\"><div style=\"min-height:5.6rem;margin-top:.5rem;padding:.6rem .75rem;border-left:4px solid {{ readoutColor }};background:var(--paper);border-radius:0 6px 6px 0\">\n            <sc-if value=\"{{ zSlow0 }}\" hint-placeholder-val=\"{{ true }}\"><div><b style=\"display:block\">Slack range<\u002Fb>The muscle lengthens with almost no resistance. Nothing here changes flexibility yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zSlow1 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">First point of tension<\u002Fb>NASM's static target: hold 30–60 s here. Within seconds of holding still, spindle discharge settles (disfacilitation) and the muscle eases.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zSlow2 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Mild discomfort<\u002Fb>NSCA's end point for static and PNF stretches. Over weeks, stretch tolerance lets this zone move further out.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zSlow3 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Pain: back off<\u002Fb>Free nerve endings act as nociceptors and limit the stretch. Stretched far enough (about 150% of resting sarcomere length), fibers risk injury.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zFast0 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Building speed<\u002Fb>Little passive tension yet, but the spindle's dynamic endings are already reading the rate of lengthening.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zFast1 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Stretch reflex<\u002Fb>A rapid length change fires the muscle spindle and the stretched muscle contracts against you. Tension rises above the passive curve.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zFast2 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Ballistic territory<\u002Fb>Bouncing near end range keeps the reflex firing, so the muscle can't relax. NSCA doesn't recommend ballistic stretching for tactical athletes.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ zFast3 }}\" hint-placeholder-val=\"{{ false }}\"><div><b style=\"display:block\">Microtrauma risk<\u002Fb>More pain and microtears, plus possible connective tissue trauma and soreness.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div data-shell=\"1\" style=\"display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,4vw,56px);max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n\n    <nav data-toc=\"1\" style=\"position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:1.4rem 0 2rem;font-size:.93rem\">\n      <div style=\"font-weight:700;padding:.5rem 0\">Contents<\u002Fdiv>\n      <div style=\"font-size:.85rem;color:var(--muted)\">Sections reviewed: {{ progText }}\n        <div style=\"height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:.3rem\"><i style=\"display:block;height:100%;background:var(--green);width:{{ progPct }}\"><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tocGroups }}\" as=\"g\" hint-placeholder-count=\"7\">\n        <div>\n          <div style=\"font-family:'Anybody',Arial,sans-serif;font-variation-settings:'wdth' 70;font-weight:750;font-size:1.02rem;margin:1rem 0 .2rem;color:var(--muted)\">{{ g.part }}<\u002Fdiv>\n          <ul style=\"list-style:none;padding:0;margin:0\">\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <li style=\"margin:0;max-width:none\"><a href=\"{{ it.href }}\" style=\"display:flex;justify-content:space-between;gap:.4rem;color:var(--ink);text-decoration:none;padding:.22rem .5rem;border-left:3px solid transparent\" style-hover=\"background:var(--card)\">{{ it.label }}<span style=\"color:var(--green);font-weight:700\">{{ it.tick }}<\u002Fspan><\u002Fa><\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <main style=\"padding:1.4rem 0 5rem;min-width:0;max-width:880px\">\n\n      <div style=\"margin:.5rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">Foundations<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Definitions and the factors, fixed and trainable, that set how far a joint can move.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"objectives\" data-screen-label=\"Objectives\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>Objectives and where to find them<\u002Fh2>\n        <p>The module lists six outcomes. Use this table to jump to the sections that answer each one.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>You should be able to<\u002Fsc-raw-th><sc-raw-th>Covered in<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Describe flexibility and myofascial release techniques<\u002Fsc-raw-td><sc-raw-td><a href=\"#terms\">Terms<\u002Fa>, <a href=\"#menu\">Methods compared<\u002Fa>, <a href=\"#myofascial\">Myofascial<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Instruct athletes in proper flexibility and mobility technique<\u002Fsc-raw-td><sc-raw-td><a href=\"#library\">Exercise library<\u002Fa>, <a href=\"#pnf\">PNF<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Create programs based on the demands of the tactical athlete<\u002Fsc-raw-td><sc-raw-td><a href=\"#tactical\">Tactical programming<\u002Fa>, <a href=\"#dosing\">Acute variables<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Explain the effects of muscle imbalances on the kinetic chain<\u002Fsc-raw-td><sc-raw-td><a href=\"#overload\">Overload<\u002Fa>, <a href=\"#imbalance\">Imbalance chain<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Explain the rationale for an integrated flexibility program<\u002Fsc-raw-td><sc-raw-td><a href=\"#overload\">Overload<\u002Fa>, <a href=\"#warmup\">Movement prep<\u002Fa>, <a href=\"#selection\">Order<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Identify appropriate techniques based on athlete needs<\u002Fsc-raw-td><sc-raw-td><a href=\"#selection\">Selection<\u002Fa>, <a href=\"#tactical\">Session planner<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\"><span data-src=\"nsca\">NSCA<\u002Fspan> chapter goals<\u002Fh4><ul><li>Describe types of flexibility exercise and myofascial release (MR)<\u002Fli><li>Describe technique and cues for flexibility and mobility exercises<\u002Fli><li>Design programs from training status, goals, and occupational demands<\u002Fli><\u002Ful><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\"><span data-src=\"nasm\">NASM<\u002Fspan> chapter goals<\u002Fh4><ul><li>Summarize why flexibility matters for different performance goals<\u002Fli><li>Explain the scientific rationale for flexibility training<\u002Fli><li>Describe flexibility and mobility techniques<\u002Fli><li>Identify acute training variables<\u002Fli><li>Select techniques from a needs analysis<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\">You cannot have mobility without flexibility.<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"objectives\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revObjectives }}\">{{ revObjectivesLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"terms\" data-screen-label=\"Defining the terms\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Defining the terms<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Both texts separate flexibility from mobility, but they draw the line in different places. Know both versions.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th style=\"box-shadow:inset 3px 0 0 var(--blue)\">NSCA (tactical)<\u002Fsc-raw-th><sc-raw-th style=\"box-shadow:inset 3px 0 0 var(--red)\">NASM (sports performance)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Flexibility<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--blue)\">The ability of <strong>muscles and tendons<\u002Fstrong> to move through the full ROM about a joint. Usually single-joint. Example: sitting with legs straight and reaching for the toes reflects hip and lumbar flexibility.<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--red)\">The <strong>normal extensibility of soft tissues<\u002Fstrong> that allows full ROM at a joint. A property of the tissue, not the joint.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Mobility<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--blue)\">The <strong>coordination and efficiency<\u002Fstrong> of movement through joint ROM. Usually multi-joint, relying on neuromuscular activation plus joint stability. Good mobility means completing a movement without compensating. Example: lunging to 90° at both knees.<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--red)\">In performance settings, a joint moving through its full ROM <strong>with control and stability<\u002Fstrong>. The WHO and much of the literature use \"mobility\" for task ability (rising from a chair, walking). Biomechanics uses it for <strong>degrees of freedom<\u002Fstrong>.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Range of motion<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--blue)\">Used throughout as joint ROM.<\u002Fsc-raw-td><sc-raw-td style=\"box-shadow:inset 3px 0 0 var(--red)\">How far a joint or segment can move, usually in degrees. Flexibility is about tissue; ROM is about the joint. Each limits the other (arthritis or surgical hardware can restrict tissue extensibility).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n\n        <h3>Active versus passive ROM <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Active ROM<\u002Fh4><p>Movement you produce with your own muscle contractions, with no outside help. Linked to <strong>active flexibility<\u002Fstrong>, which correlates more strongly with athletic ability and carries over better to sport.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Passive ROM<\u002Fh4><p>Movement available when an external force moves a relaxed joint, often applied by a PT or AT to find stiffness or adhesions. Linked to <strong>passive flexibility<\u002Fstrong>, which is usually <strong>greater<\u002Fstrong> than active.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p>Why passive ROM still matters: a joint shows more passive than active range because a small amount of motion can't be voluntarily controlled, partly because muscles can lengthen more than they can shorten. That reserve is a buffer when an outside force pushes a limb past its usual range, such as slipping on wet grass or getting caught in an awkward tackle. Improving passive ROM under a trained professional may in turn raise active ROM.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">Know the counterargument<\u002Fspan>Nuzzo (2020) argued flexibility should be de-emphasized as a fitness component, based on the sit-and-reach test's weak link to functional tasks. NASM's rebuttal: the sit-and-reach is only a <em>measure<\u002Fem> of flexibility, not flexibility itself.<\u002Fdiv>\n\n        <h3>Degrees of freedom <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Degrees of freedom (DOF) are the number of independent directions a joint can move, often counted as axes of rotation. The body has three axes: anterior–posterior, mediolateral, and superior–inferior.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption>The knee as an example<\u002Fsc-raw-caption>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Motion<\u002Fsc-raw-th><sc-raw-th>Axis<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Flexion and extension<\u002Fsc-raw-td><sc-raw-td>Mediolateral<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Internal and external rotation (when flexed)<\u002Fsc-raw-td><sc-raw-td>Superior–inferior<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Slight abduction and adduction<\u002Fsc-raw-td><sc-raw-td>Anterior–posterior<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td colspan=\"2\"><strong>3 DOF<\u002Fstrong> in rotation. Add translation along each axis and the knee has <strong>6 DOF<\u002Fstrong> (Komdeur et al., 2002).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">DOF is not ROM<\u002Fspan>DOF counts the axes a joint can rotate around. ROM is how far it rotates around each of them.<\u002Fdiv>\n        <p><strong>Hypermobility<\u002Fstrong> is movement beyond normal ROM. Clinically, it is a hereditary, multisystem connective tissue disorder with joint instability and chronic pain.<\u002Fp>\n\n        <h3>Why it matters<\u002Fh3>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--blue);background:var(--blue-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">NSCA key point<\u002Fspan>Flexibility and joint mobility are the foundation for strength, speed, agility, power, and endurance. Tactical athletes need flexibility to generate movement and mobility to perform with minimal limitation.<\u002Fdiv>\n        <p><span data-src=\"nasm\">NASM<\u002Fspan> frames it by sport: a taekwondo athlete who can't get the hip high enough won't land head kicks. How much flexibility matters depends on the sport, the type of flexibility, the training method, and individual factors (age, sex, occupation, injury history, training experience).<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Coach's corner: fear of range<\u002Fspan>Some athletes avoid a range because of fear, usually tied to a past injury. Explain the actual risk clearly and reassure them. Point out the benefits (range, lower injury risk, performance, stress relief), and let them stretch inside their comfort zone without forcing it.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"terms\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revTerms }}\">{{ revTermsLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"factors\" data-screen-label=\"What shapes flexibility\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>What shapes flexibility<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Some limits come with your anatomy. Others, like activity level and body composition, respond to training.<\u002Fp>\n\n        <h3>The tactical context <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>Tactical athletes range from 18 to over 50, with very different years of service and job demands. They squat, kneel, and crawl for long periods, often under equipment load, and move both unilaterally and bilaterally. Poor mobility shows up as faulty alignment and restricted movement, caused either by tight muscles or by weak muscles that can't move a segment through its range. Long off-duty periods in static positions such as sitting cause <strong>adaptive shortening<\u002Fstrong>: tightness from muscles staying in a shortened position.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\">\n            <h4 style=\"margin-top:0\">Physiological factors<\u002Fh4>\n            <ul>\n              <li><strong>Age.<\u002Fstrong> Function and flexibility decline together, tied to limiting conditions and less activity.<\u002Fli>\n              <li><strong>Sex<\u002Fstrong><\u002Fli>\n              <li><strong>Physical activity level<\u002Fstrong> (trainable). Inactivity and disuse cost joint mobility; exercise, especially resistance training, blunts age-related losses.<\u002Fli>\n              <li><strong>Body composition<\u002Fstrong> (trainable). Large segments from fat or muscle can block ROM without the tissue actually being inflexible.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\">\n            <h4 style=\"margin-top:0\">Kinesiological factors<\u002Fh4>\n            <ul>\n              <li><strong>Origin and insertion<\u002Fstrong> of muscles and tendons, and limb lengths<\u002Fli>\n              <li><strong>Joint structure and integrity<\u002Fstrong>: capsule, ligaments, tendons, crossing muscles, and joint geometry<\u002Fli>\n              <li><strong>Muscle cross-sectional area<\u002Fstrong><\u002Fli>\n              <li><strong>Connective tissue<\u002Fstrong> make-up (collagen versus elastin)<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h4>Age-related conditions that reduce flexibility<\u002Fh4>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Condition<\u002Fsc-raw-th><sc-raw-th>What happens<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Sarcopenia<\u002Fsc-raw-td><sc-raw-td>Loss of muscle tissue.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Fibrosis<\u002Fsc-raw-td><sc-raw-td>Fibrous connective tissue replaces degenerating muscle. It is less pliable, so joints stiffen and flexibility drops.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Arthritis<\u002Fsc-raw-td><sc-raw-td>Joint pain and stiffness.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p style=\"font-size:.92rem;color:var(--muted)\"><span data-src=\"nasm\">NASM<\u002Fspan> adds loss of muscle elasticity and mass, joint degeneration, and loss of motor neurons. Older athletes also bring years of accumulated form habits and injuries, so give them a full postural assessment.<\u002Fp>\n\n        <h3>Inside the sarcomere <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>Myofibrils are built from sarcomeres containing <strong>actin<\u002Fstrong> and <strong>myosin<\u002Fstrong> (which shorten the muscle and develop tension) plus the connecting filament <strong>titin<\u002Fstrong>. During a stretch, actin and myosin pull apart and titin lengthens. Once titin reaches its resting tension, the muscle resists further stretch. Past that, the sarcomere can be damaged. A sarcomere can stretch to about <strong>150% of resting length<\u002Fstrong> before injury.<\u002Fp>\n\n        <h3>Joint structure<\u002Fh3>\n        <p>The hip and shoulder allow large ROM in many directions. The elbow, knee, ankle, and wrist are limited by their anatomy to less range in fewer directions.<\u002Fp>\n\n        <h3>Where joint stiffness comes from <span data-src=\"both\">Both<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;height:46px;border-radius:6px;overflow:hidden;border:1.5px solid var(--rule);margin:.6rem 0 .4rem\">\n          <span style=\"display:flex;align-items:center;padding:0 .5rem;font-weight:700;font-size:.9rem;width:47%;background:var(--blue-soft)\">47%<\u002Fspan>\n          <span style=\"display:flex;align-items:center;padding:0 .5rem;font-weight:700;font-size:.9rem;width:41%;background:var(--red-soft);color:var(--red)\">41%<\u002Fspan>\n          <span style=\"display:flex;align-items:center;padding:0 .5rem;font-weight:700;font-size:.9rem;width:10%;background:var(--amber-soft)\">10%<\u002Fspan>\n          <span style=\"display:flex;width:2%;background:var(--ink)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.3rem .9rem;font-size:.92rem\">\n          <span><i style=\"display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.35rem;border:1px solid var(--rule);background:var(--blue-soft)\"><\u002Fi>Joint capsule &amp; ligaments 47%<\u002Fspan>\n          <span><i style=\"display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.35rem;border:1px solid var(--rule);background:var(--red-soft)\"><\u002Fi>Muscle fascia 41%<\u002Fspan>\n          <span><i style=\"display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.35rem;border:1px solid var(--rule);background:var(--amber-soft)\"><\u002Fi>Tendons 10%<\u002Fspan>\n          <span><i style=\"display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.35rem;border:1px solid var(--rule);background:var(--ink)\"><\u002Fi>Skin 2%<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:1rem\"><strong>Collagen<\u002Fstrong> (ligaments, tendons) is rigid and restricts ROM. <strong>Elastin<\u002Fstrong> allows range. Per NSCA, fascia is mostly elastic tissue. That makes muscle fascia the key target for improving flexibility, even though capsule, ligaments, and tendons contribute more stiffness overall. Overstretching the less-elastic capsule, ligaments, and tendons creates <strong>instability<\u002Fstrong>.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--blue);background:var(--blue-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">The trade-off<\u002Fspan>A less stiff joint is more flexible but less stable; a more stable joint has less flexible surrounding tissue. Ideal flexibility balances stiffness against instability. It depends on genetics plus controllable factors (activity, body composition, recovery), which is why programs must be individualized and reassessed regularly.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"factors\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revFactors }}\">{{ revFactorsLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">The science of stretch<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Range of motion is set as much by the nervous system's response to stretch as by the tissue itself.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"receptors\" data-screen-label=\"The body's sensors\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>The body's sensors<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\"><strong>Proprioception<\u002Fstrong> is the body's sense of its orientation and the position of its parts. It is built from <strong>mechanoreceptors<\u002Fstrong>: structures that turn touch, pressure, and stretch into signals sent to the CNS.<\u002Fp>\n        <p>When a joint moves, tissues on one side lengthen and the other side shortens. During knee flexion, the quadriceps and their tendons, the front of the knee capsule, and the overlying skin stretch, while the hamstrings shorten. The CNS reads these changes to judge how far the joint has moved and whether to add muscle tone for stability. It merges this with vision and hearing into an internal map of which actions are possible right now.<\u002Fp>\n\n        <figure style=\"margin:1.2rem 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem\">\n          <div style=\"position:relative;width:100%;max-width:660px;margin:0 auto\">\n            <svg sc-camel-view-box=\"0 0 660 270\" style=\"display:block;width:100%;height:auto\">\n              <path d=\"M40 135 C 80 60, 380 50, 440 108 L 440 162 C 380 220, 80 210, 40 135 Z\" fill=\"#F6E3E7\" stroke=\"var(--red)\" stroke-width=\"2\"><\u002Fpath>\n              <g stroke=\"var(--red)\" stroke-width=\"1\" opacity=\"0.45\">\n                <line x1=\"70\" y1=\"112\" x2=\"430\" y2=\"112\"><\u002Fline><line x1=\"60\" y1=\"124\" x2=\"438\" y2=\"124\"><\u002Fline><line x1=\"58\" y1=\"146\" x2=\"438\" y2=\"146\"><\u002Fline><line x1=\"70\" y1=\"158\" x2=\"430\" y2=\"158\"><\u002Fline>\n              <\u002Fg>\n              <path d=\"M440 108 L 560 122 L 560 148 L 440 162 Z\" fill=\"#F6E9CF\" stroke=\"var(--amber-ink)\" stroke-width=\"2\"><\u002Fpath>\n              <rect x=\"560\" y=\"100\" width=\"70\" height=\"70\" rx=\"6\" fill=\"#E9EEF4\" stroke=\"var(--line-strong)\" stroke-width=\"2\"><\u002Frect>\n              <path d=\"M160 135 C 190 122, 250 122, 280 135 C 250 148, 190 148, 160 135 Z\" fill=\"var(--card)\" stroke=\"var(--blue)\" stroke-width=\"2.5\"><\u002Fpath>\n              <path d=\"M205 128 l6 14 l6 -14 l6 14 l6 -14 l6 14\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2\"><\u002Fpath>\n              <path d=\"M220 124 L 220 40\" stroke=\"var(--blue)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"><\u002Fpath>\n              <circle cx=\"220\" cy=\"38\" r=\"3\" fill=\"var(--blue)\"><\u002Fcircle>\n              <ellipse cx=\"452\" cy=\"135\" rx=\"16\" ry=\"11\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"><\u002Fellipse>\n              <path d=\"M440 135 q6 -8 12 0 t12 0\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"><\u002Fpath>\n              <path d=\"M452 146 L 452 232\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"><\u002Fpath>\n              <circle cx=\"452\" cy=\"234\" r=\"3\" fill=\"var(--ink)\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div style=\"position:absolute;left:84%;top:44%;font-size:.8rem;color:var(--muted)\">bone<\u002Fdiv>\n            <div style=\"position:absolute;left:70%;top:68%;font-size:.8rem;color:var(--amber-ink);font-weight:700\">tendon<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.6rem 1.2rem;margin-top:.9rem\">\n            <div style=\"border-left:3px solid var(--blue);padding-left:.6rem\">\n              <strong>Muscle spindle<\u002Fstrong>\n              <div style=\"color:var(--muted);font-size:.85rem\">Parallel to the fibers; senses length and speed. Rapid stretch → <strong style=\"color:var(--blue)\">stretch reflex<\u002Fstrong>: the stretched muscle contracts.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left:3px solid var(--rule);padding-left:.6rem\">\n              <strong>Golgi tendon organ<\u002Fstrong>\n              <div style=\"color:var(--muted);font-size:.85rem\">At the muscle–tendon junction; senses tension. High tension → <strong style=\"color:var(--ink)\">autogenic inhibition<\u002Fstrong>: the tensed muscle relaxes.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption>The two sensors pull in opposite directions. The spindle protects against overstretch by contracting the muscle; the GTO protects against overload by relaxing it.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Receptor<\u002Fsc-raw-th><sc-raw-th>Location<\u002Fsc-raw-th><sc-raw-th>Detects<\u002Fsc-raw-th><sc-raw-th>Role in flexibility<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Muscle spindle<\u002Fsc-raw-td><sc-raw-td>Within and parallel to the force-producing fibers. Spindle fibers are <strong>intrafusal<\u002Fstrong>; regular fibers are <strong>extrafusal<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>Muscle length and rate of length change. <strong>Primary (dynamic)<\u002Fstrong> endings respond to magnitude and velocity. <strong>Secondary (static)<\u002Fstrong> endings report static length, so they mainly serve position sense.<\u002Fsc-raw-td><sc-raw-td>Rapid lengthening near end range triggers the <strong>stretch reflex<\u002Fstrong>, contracting the stretched muscle to protect bones, cartilage, and ligaments. Output settles during sustained holds.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Golgi tendon organ<\u002Fsc-raw-td><sc-raw-td>Musculotendinous junction. About 5–25 muscle fibers enter each capsule and attach to collagen bundles that continue into the tendon.<\u002Fsc-raw-td><sc-raw-td>Tension and rate of tension change, mainly <strong>during contraction<\u002Fstrong>. Sensory neurons braid through the collagen, so pulling on the tendon deforms them.<\u002Fsc-raw-td><sc-raw-td>Excess tension triggers <strong>autogenic inhibition<\u002Fstrong> (the inverse stretch or inverse myotatic reflex): the contracting muscle is told to relax.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Joint receptors<\u002Fsc-raw-td><sc-raw-td>Joint capsule, ligaments, and surrounding connective tissue. Includes <strong>Ruffini endings<\u002Fstrong> (slow-adapting, encapsulated) and free nerve endings.<\u002Fsc-raw-td><sc-raw-td>Position, movement, pressure, acceleration, and deceleration. Nearly silent in mid-range; most active near physiological limits.<\u002Fsc-raw-td><sc-raw-td>Mainly signal the <strong>limits of motion<\u002Fstrong>. Capsule and ligaments provide up to 47% of resistance to movement.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Free nerve endings<\u002Fsc-raw-td><sc-raw-td>Unencapsulated. Joint capsule, muscle and its connective tissue, skin, ligaments, tendons. Type III (small myelinated) and type IV (unmyelinated) afferents.<\u002Fsc-raw-td><sc-raw-td>Stimuli strong enough to cause harm; also temperature, pressure, and pain. They act as <strong>nociceptors<\u002Fstrong>.<\u002Fsc-raw-td><sc-raw-td>If a stretch exceeds tolerance, they limit the stretch or trigger a withdrawal reflex. Their influence depends on experience and stretch tolerance.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Cutaneous receptors<\u002Fsc-raw-td><sc-raw-td>Skin. Mostly type II, slowly adapting.<\u002Fsc-raw-td><sc-raw-td>Skin tension patterns that reveal the size and direction of joint movement.<\u002Fsc-raw-td><sc-raw-td>Small limiting role: skin is only about 2% of joint resistance.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Getting technical: mechanotransduction<\u002Fspan>Cells convert mechanical stimuli into electrochemical signals. When muscles compress and lengthen, cells sense deformation of their membranes and surroundings, which triggers processes such as protein synthesis and hormone production.<\u002Fdiv>\n\n        <h3>Flexibility is velocity-specific <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Because spindles have separate dynamic and static endings, the stretch reflex also has dynamic and static forms. By the SAID principle, flexibility adaptations are likely speed-dependent, as with resistance training. This explains martial artists who can hold a full split but can't reach the same range in a high kick. Dedicated dynamic stretching narrows that gap, though the mechanism needs more research.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"receptors\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revReceptors }}\">{{ revReceptorsLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"neural\" data-screen-label=\"Neural mechanisms\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Neural mechanisms<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">The goal of flexibility training, in NSCA's words, is to minimize a muscle's reflex activity so it resists the stretch less. Each mechanism below is a different route to that.<\u002Fp>\n\n        <h3>The stretch reflex and why it matters <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>When muscle length changes, receptors gauge the change and respond to prevent overstretching. A sudden increase in length causes a reflexive shortening contraction. That is why bouncing into a stretch works against you. Reciprocal inhibition can partly cancel the reflex: contracting the opposing muscle lets the stretched muscle relax further.<\u002Fp>\n\n        <h3>The lengthening reaction <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>The cascade of neural events that lets a muscle be stretched. Mechanoreceptors sense tension and balance two jobs: preventing injury from excessive contraction or lengthening, and still allowing full functional range. When GTOs detect high tension, they cause reflexive relaxation through inhibitory interneurons. NASM also locates GTOs in the joint capsule in this passage. Promoting this reaction through stretching may reduce strains and tears.<\u002Fp>\n\n        <h3>Autogenic inhibition <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Tension-sensing impulses override the impulses driving contraction, which inhibits the muscle. In practice: place a muscle in a passive stretch, contract it isometrically, then hold it at the same range or move deeper. This is the logic behind \"hold–relax\" and \"contract–relax,\" grouped as <strong>neuromuscular stretching<\u002Fstrong>.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">The evidence is shaky<\u002Fspan>GTOs are mostly active <em>during<\u002Fem> a contraction, so their inhibition fades almost as soon as the contraction stops. Evidence that this reflex drives neuromuscular stretching gains is lacking. Better explanations: a large temporary drop in motor neuron excitability while the stretch is held (similar to static stretching), increased stretch tolerance, and thixotropic changes (tissue viscosity decreasing).<\u002Fdiv>\n\n        <h3>Reciprocal inhibition <span data-src=\"both\">Both<\u002Fspan><\u002Fh3>\n        <p>When an agonist contracts, its antagonist receives an inhibitory signal and relaxes. This is what lets normal movement happen without opposing muscles fighting each other.<\u002Fp>\n        <p><strong>How it works:<\u002Fstrong> the CNS commands that activate the agonist's motor neurons also excite <strong>Ia inhibitory interneurons<\u002Fstrong> that synapse onto the antagonist's motor neurons, blocking a reflexive contraction there. Example: contract the quadriceps during a hamstring stretch and the hamstrings relax more.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">Also shaky in PNF<\u002Fspan>It is often cited as the reason stretches that include a contraction of the opposing muscle produce bigger ROM gains. Sharman et al. (2006) agreed that stronger opposing-muscle activation relaxes the target muscle more, but found little clinical evidence that this plays a big role in neuromuscular stretching. It is well documented in dynamic activity, so its effect is probably largest in dynamic stretches.<\u002Fdiv>\n\n        <h3>Inhibition versus disfacilitation <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th>Inhibition<\u002Fsc-raw-th><sc-raw-th>Disfacilitation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Type<\u002Fsc-raw-td><sc-raw-td>Active<\u002Fsc-raw-td><sc-raw-td>Passive<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Mechanism<\u002Fsc-raw-td><sc-raw-td>Inhibitory interneurons fire and stop motor neurons from firing.<\u002Fsc-raw-td><sc-raw-td>Less excitatory input reaches the motor neurons.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Stretching example<\u002Fsc-raw-td><sc-raw-td>Active stretch: contracting the antagonist sends signals that suppress the target muscle.<\u002Fsc-raw-td><sc-raw-td>A long passive static hold.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Cycling analogy<\u002Fsc-raw-td><sc-raw-td>Squeezing the brakes.<\u002Fsc-raw-td><sc-raw-td>Easing off the pedals and coasting.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n\n        <h3>Muscle spindle disfacilitation <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>ROM is closely tied to resistance from <strong>tonic reflexes<\u002Fstrong>: automatic muscle responses to stimuli like position or length changes. Dynamic stretching excites the neuromuscular system; static stretching turns the stretch reflex down.<\u002Fp>\n        <p>In a passive static stretch, the muscle is lengthened at a slow to moderate rate and held, typically 15–60 seconds. Once end range is reached the stretch rate stops changing, and within seconds the <strong>nuclear bag fibers<\u002Fstrong> in the spindle lower their discharge rate. As the hold continues they accommodate further. The nervous system also works to return spindles to resting length, so <strong>nuclear chain fibers<\u002Fstrong> discharge less and reflex contractions drop further. One hour of repeated passive calf stretching reduced stretch reflexes by <strong>44–85%<\u002Fstrong> (Avela et al., 1999).<\u002Fp>\n\n        <h3>Stretch tolerance <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>A theoretical model in which the nervous system learns that the discomfort of stretching isn't injury, so it perceives the stretch as less threatening and tolerance rises over time. It came from studies where ROM increased after several weeks of stretching while the tissues' mechanical properties stayed the same (Ben &amp; Harvey, 2010; LaRoche &amp; Connolly, 2006; Mitchell et al., 2007).<\u002Fp>\n        <p>Higher tolerance lets athletes stretch further and longer, but further and longer isn't necessary for every athlete or sport.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Getting technical: pain modulation<\u002Fspan>Stretch tolerance may be linked to the body's own pain modulation and could indicate pain sensitivity during rehab (Støve et al., 2021). An athlete struggling to regain ROM after injury might tap into those inhibitory systems through exercise or a competing painful stimulus, such as pressing a massage tool into a sensitive spot, then use the raised tolerance to move deeper.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"neural\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revNeural }}\">{{ revNeuralLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"tissue\" data-screen-label=\"Muscle and fascia\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Muscle and fascia<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Muscle properties split into active and passive components. Flexibility training mostly acts on the passive side: the connective tissue wrapped around and through the muscle.<\u002Fp>\n\n        <h3>Layers of skeletal muscle <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Connective tissue<\u002Fsc-raw-th><sc-raw-th>Wraps<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Epimysium<\u002Fsc-raw-td><sc-raw-td>The entire muscle, packaging all fascicles into one unit.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Perimysium<\u002Fsc-raw-td><sc-raw-td>Each <strong>fascicle<\u002Fstrong> (a bundle of hundreds of muscle fibers).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Endomysium<\u002Fsc-raw-td><sc-raw-td>Each individual muscle fiber (one muscle cell).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>Together these coverings form the <strong>parallel elastic component (PEC)<\u002Fstrong>. They produce the passive tension you feel in a stretched muscle, and they blend into the tendon, which blends into the connective tissue covering bone.<\u002Fp>\n\n        <h3>Fiber arrangement<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Parallel<\u002Fh4><p>Fascicles run along the muscle's long axis. Example: biceps brachii.<\u002Fp><ul><li>More ROM, less force<\u002Fli><li>Lower passive resistance, so they may respond better to <strong>passive<\u002Fstrong> stretching<\u002Fli><\u002Ful><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Pennate<\u002Fh4><p>Fibers angle obliquely to the line of pull, like the vanes of a feather (Latin <em>pennatus<\u002Fem>, \"winged\"). Unipennate, bipennate, or multipennate.<\u002Fp><ul><li>More force, less ROM<\u002Fli><li>Greater physiological cross-sectional area means stronger contractions depress stretch sensitivity more, so they may respond better to <strong>active methods with isometric contractions<\u002Fstrong><\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>The fascial system<\u002Fh3>\n        <p><strong>Fascia<\u002Fstrong> is the collective name for the connective tissue enveloping muscles and bones, including the endo-, peri-, and epimysium. It is made of cells, fibers, and a shapeless gel called <strong>ground substance<\u002Fstrong>.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Component<\u002Fsc-raw-th><sc-raw-th>Type<\u002Fsc-raw-th><sc-raw-th>Job<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Fibroblasts<\u002Fsc-raw-td><sc-raw-td>Cell<\u002Fsc-raw-td><sc-raw-td>Produce connective tissue fibers<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Fasciacytes<\u002Fsc-raw-td><sc-raw-td>Cell<\u002Fsc-raw-td><sc-raw-td>Produce <strong>hyaluronan<\u002Fstrong>, which lets fascial layers slide on each other<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Adipocytes<\u002Fsc-raw-td><sc-raw-td>Cell<\u002Fsc-raw-td><sc-raw-td>Store fat within connecti
