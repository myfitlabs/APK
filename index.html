le.\",\"Video 1:01\"],\n [\"stick\",\"Active stick raises: flexion\",\"Shoulder flexion\",\"Standing, raising a stick overhead.\",\"Video 0:54\"],\n [\"stick\",\"Active stick raises: extension\",\"Shoulder extension\",\"Standing with the stick behind the body, lifting it away.\",\"Video\"],\n [\"stick\",\"Slapshot\",\"Hamstrings, trunk rotation\",\"Wide stance, sweeping one arm down along a planted stick while the other reaches up.\",\"Video 0:46\"],\n [\"assist\",\"Assisted calves\",\"Calves\",\"Your note: hold at the calcaneus and push the foot forward to stretch the calves.\",\"Video 1:26\"],\n [\"assist\",\"Assisted hamstrings\",\"Hamstrings\",\"Your notes: hip flexion plus adduction; 20–30 s static; athlete pushes into hip extension with slight knee flexion ~20% for 7–10 s; relax, move to the new barrier, contract the quads into it 20–30 s.\",\"Video 2:09\"],\n [\"assist\",\"Assisted adductors\",\"Adductors\",\"Partner-assisted adductor stretch using CRAC.\",\"Video 1:12\"],\n [\"assist\",\"Assisted adductor magnus\",\"Adductor magnus\",\"Partner-assisted adductor magnus stretch using CRAC.\",\"Video 1:17\"],\n [\"assist\",\"Assisted hip flexors\",\"Hip flexors\",\"Partner-assisted hip flexor stretch using CRAC.\",\"Video 1:54\"],\n [\"assist\",\"Assisted posterior hip\",\"Glutes, hip rotators\",\"Partner-assisted posterior hip stretch using CRAC.\",\"Video 1:07\"],\n [\"assist\",\"Assisted quadratus lumborum\",\"Quadratus lumborum\",\"Partner-assisted QL stretch using CRAC.\",\"Video 1:50\"],\n [\"assist\",\"Assisted chest\",\"Chest\",\"Partner-assisted chest stretch using CRAC.\",\"Video 1:07\"],\n [\"assist\",\"Assisted lats\",\"Lats\",\"Partner-assisted lat stretch using CRAC.\",\"Video 1:08\"],\n [\"assist\",\"Assisted triceps\",\"Triceps\",\"Partner-assisted triceps stretch using CRAC.\",\"Video 0:57\"],\n [\"assist\",\"Assisted upper trapezius\",\"Upper trapezius\",\"Partner-assisted upper trap stretch using CRAC.\",\"Video 1:54\"]\n].map(r => ({ g: r[0], n: r[1], r: r[2], c: r[3], d: r[4] }));\n\nconst QCATS = [[\"study\",\"NSCA study questions\"],[\"defs\",\"Definitions & factors\"],[\"neuro\",\"Sensors & neural\"],[\"tissue\",\"Muscle & fascia\"],[\"dys\",\"Dysfunction\"],[\"tech\",\"Techniques\"],[\"dose\",\"Dosing numbers\"],[\"prog\",\"Programming\"]];\n\nconst QUIZ = [\n {c:\"study\",s:\"nsca\",q:\"Which of the following is a kinesiological factor that affects mobility and flexibility?\",o:[\"Muscle origin and insertion\",\"Age\",\"Physical activity level\",\"Body composition\"],e:\"Age, activity level, and body composition are physiological factors. Kinesiological factors are structural: origin and insertion, joint structure, muscle cross-sectional area, and connective tissue make-up.\"},\n {c:\"study\",s:\"nsca\",q:\"Which of the following structures is responsible for initiating the stretch reflex?\",o:[\"Muscle spindle\",\"Golgi tendon organ\",\"Myosin and actin\",\"Collagen and elastin\"],e:\"Spindles lie parallel to the muscle fibers and sense length and its rate of change. A rapid stretch fires them and the stretched muscle contracts. The GTO does the opposite: high tension makes the muscle relax.\"},\n {c:\"study\",s:\"nsca\",q:\"Which stretching technique involves controlled, activity-specific movements that extend the muscles to exceed end ROM?\",o:[\"Dynamic\",\"Static\",\"PNF\",\"Ballistic\"],e:\"Ballistic stretching also goes past end range, but with uncontrolled bouncing and swinging. Controlled and activity-specific point to dynamic stretching.\"},\n {c:\"study\",s:\"nsca\",q:\"Which of the following guidelines applies to using a foam roller?\",o:[\"Avoid rolling over joints or areas where there is little soft tissue.\",\"Roll each area for 5 to 10 seconds.\",\"Go around any extremely sensitive areas.\",\"Position the roller 4 in. (10.2 cm) away from the area of focus.\"],e:\"NSCA: roll each area 15–30 s, stop on very sensitive spots and apply gradual pressure for 30–60 s, and position the roller directly over or under the target area.\"},\n {c:\"defs\",s:\"nsca\",q:\"In NSCA's framing, which statement describes mobility rather than flexibility?\",o:[\"Coordinated, efficient movement through joint ROM, usually across multiple joints\",\"Muscles and tendons moving through the full ROM about a single joint\",\"The normal extensibility of soft tissues that allows full joint ROM\",\"Movement beyond normal ROM\"],e:\"NSCA flexibility is single-joint muscle and tendon range. Normal extensibility of soft tissues is NASM's flexibility definition, and movement beyond normal ROM is hypermobility.\"},\n {c:\"defs\",s:\"nasm\",q:\"Which type of flexibility correlates more strongly with athletic ability and carries over better to sport?\",o:[\"Active flexibility\",\"Passive flexibility\",\"Static flexibility\",\"Hypermobility\"],e:\"Active flexibility comes from the athlete's own contractions. Passive flexibility is usually greater, and that reserve acts as a buffer when an outside force moves the joint.\"},\n {c:\"defs\",s:\"both\",q:\"Which structures contribute the largest share of joint stiffness?\",o:[\"Joint capsule and ligaments\",\"Muscle fascia\",\"Tendons\",\"Skin\"],e:\"Capsule and ligaments 47%, muscle fascia 41%, tendons 10%, skin 2%.\"},\n {c:\"defs\",s:\"nsca\",q:\"Why does NSCA call muscle fascia the key target for improving flexibility, even though capsule and ligaments contribute more stiffness?\",o:[\"Fascia is mostly elastic tissue, so it responds to stretching\",\"Fascia contains the most collagen\",\"Fascia holds the most muscle spindles\",\"Fascia contributes the least resistance, so it's safest to ignore\"],e:\"Collagen in ligaments and tendons is rigid and restricts range. Overstretching those less-elastic tissues trades flexibility for instability.\"},\n {c:\"defs\",s:\"nasm\",q:\"How many degrees of freedom does the knee have when translation along each axis is counted?\",o:[\"6\",\"3\",\"2\",\"9\"],e:\"Three rotational DOF (flexion–extension, internal–external rotation when flexed, slight abduction–adduction). Adding translation along each axis gives 6 (Komdeur et al., 2002).\"},\n {c:\"defs\",s:\"nsca\",q:\"Replacement of degenerating muscle with less pliable fibrous connective tissue is called:\",o:[\"Fibrosis\",\"Sarcopenia\",\"Arthritis\",\"Hypermobility\"],e:\"Sarcopenia is loss of muscle tissue; arthritis is joint pain and stiffness. Fibrosis stiffens joints because the replacement tissue is less pliable.\"},\n {c:\"neuro\",s:\"nasm\",q:\"Where is the Golgi tendon organ located?\",o:[\"At the musculotendinous junction\",\"Within and parallel to the extrafusal fibers\",\"In the joint capsule\",\"In the skin\"],e:\"About 5–25 muscle fibers enter each GTO capsule and attach to collagen bundles that continue into the tendon. The spindle is the receptor that sits parallel to the fibers.\"},\n {c:\"neuro\",s:\"both\",q:\"Contracting the quadriceps during a hamstring stretch so the hamstrings relax more uses:\",o:[\"Reciprocal inhibition\",\"Autogenic inhibition\",\"The stretch reflex\",\"Synergistic dominance\"],e:\"Commands that activate the agonist also excite Ia inhibitory interneurons that block the antagonist's motor neurons. Autogenic inhibition relaxes the muscle that is itself under tension.\"},\n {c:\"neuro\",s:\"nasm\",q:\"Why does NASM consider the evidence for autogenic inhibition in neuromuscular stretching weak?\",o:[\"GTO inhibition fades almost as soon as the contraction stops\",\"GTOs only respond to rapid stretch\",\"GTOs are located in the skin\",\"Autogenic inhibition increases motor neuron excitability\"],e:\"GTOs are mostly active during contraction. Better explanations for the gains include a temporary drop in motor neuron excitability during the hold and increased stretch tolerance.\"},\n {c:\"neuro\",s:\"nasm\",q:\"A long, passive static hold lowers motor neuron output mainly through:\",o:[\"Disfacilitation\",\"Inhibition\",\"Reciprocal inhibition\",\"Post-activation potentiation\"],e:\"Inhibition is active, like squeezing the brakes. Disfacilitation is passive, like easing off the pedals: less excitatory input reaches the motor neurons.\"},\n {c:\"neuro\",s:\"nasm\",q:\"After one hour of calf stretching, the stretch reflex decreased by roughly:\",o:[\"44–85%\",\"5–10%\",\"20–30%\",\"90–100%\"],e:\"Avela et al. reported a 44–85% drop, which shows how strongly prolonged stretching turns down spindle-driven reflexes.\"},\n {c:\"neuro\",s:\"nasm\",q:\"Which model explains ROM gains over several weeks while the tissues' mechanical properties stay the same?\",o:[\"Stretch tolerance\",\"Thixotropy\",\"Pattern overload\",\"Mechanotransduction\"],e:\"The nervous system learns that stretching discomfort isn't injury, so it perceives the stretch as less threatening and allows more range.\"},\n {c:\"neuro\",s:\"nasm\",q:\"A martial artist can hold a full split but can't reach that range in a high kick. NASM explains this with:\",o:[\"Velocity-specific flexibility (SAID principle)\",\"Passive insufficiency\",\"Hypermobility\",\"Altered reciprocal inhibition\"],e:\"Spindles have separate dynamic and static endings, so flexibility adaptations are likely speed-dependent. Train range at the speeds the sport uses.\"},\n {c:\"neuro\",s:\"nasm\",q:\"Which receptors are nearly silent in mid-range and most active near a joint's physiological limits?\",o:[\"Joint receptors\",\"Muscle spindle primary endings\",\"Golgi tendon organs\",\"Cutaneous receptors\"],e:\"Joint receptors in the capsule, ligaments, and surrounding tissue mainly signal the limits of motion.\"},\n {c:\"tissue\",s:\"nasm\",q:\"Which connective tissue layer wraps each fascicle?\",o:[\"Perimysium\",\"Epimysium\",\"Endomysium\",\"Periosteum\"],e:\"Epimysium wraps the whole muscle, perimysium each fascicle, and endomysium each individual fiber.\"},\n {c:\"tissue\",s:\"nasm\",q:\"Together, the epimysium, perimysium, and endomysium form the:\",o:[\"Parallel elastic component\",\"Series elastic component\",\"Myotendinous junction\",\"Sarcomere\"],e:\"The PEC produces the passive tension you feel in a stretched muscle and blends into the tendon.\"},\n {c:\"tissue\",s:\"nasm\",q:\"Which fascial cells produce hyaluronan so fascial layers can slide on each other?\",o:[\"Fasciacytes\",\"Fibroblasts\",\"Adipocytes\",\"Elastin fibers\"],e:\"Fibroblasts produce connective tissue fibers, adipocytes store fat, and elastin is a fiber rather than a cell.\"},\n {c:\"tissue\",s:\"nasm\",q:\"Compared with pennate muscles, parallel-fibered muscles have:\",o:[\"More ROM and less force\",\"More force and less ROM\",\"Greater physiological cross-sectional area\",\"Higher passive resistance to stretch\"],e:\"Parallel muscles have lower passive resistance, so they may respond better to passive stretching. Pennate muscles may respond better to active methods with contractions.\"},\n {c:\"tissue\",s:\"nsca\",q:\"During a stretch, what happens once titin reaches its resting tension?\",o:[\"The muscle resists further stretch\",\"The muscle contracts reflexively\",\"All passive tension disappears\",\"Actin and myosin cross-bridges pull the sarcomere shorter\"],e:\"Actin and myosin pull apart and titin lengthens until it reaches resting tension. Push far enough beyond that (about 150% of resting length) and fibers risk injury.\"},\n {c:\"dys\",s:\"nasm\",q:\"Which sequence correctly follows a muscle imbalance?\",o:[\"Altered reciprocal inhibition → synergistic dominance → joint dysfunction\",\"Synergistic dominance → altered reciprocal inhibition → joint dysfunction\",\"Joint dysfunction → synergistic dominance → altered reciprocal inhibition\",\"Inflammation → muscle spasm → adhesions\"],e:\"The chain ends in poor neuromuscular efficiency. The last option is part of the cumulative injury cycle, not the imbalance chain.\"},\n {c:\"dys\",s:\"nasm\",q:\"An athlete with an inhibited gluteus maximus reports chronically tight hamstrings when running. This is best described as:\",o:[\"Synergistic dominance\",\"Autogenic inhibition\",\"Hypermobility\",\"Passive insufficiency\"],e:\"The hamstrings, a synergist in hip extension, take over as the main force producer. Stretching them alone misses the cause: an underactive glute max.\"},\n {c:\"dys\",s:\"nasm\",q:\"In the cumulative injury cycle, what directly follows muscle spasm?\",o:[\"Adhesions\",\"Inflammation\",\"Tissue trauma\",\"Muscle imbalance\"],e:\"Tissue trauma → inflammation → muscle spasm → adhesions → altered neuromuscular control → muscle imbalance → back to tissue trauma.\"},\n {c:\"dys\",s:\"nasm\",q:\"Roll, slide, and spin of joint surfaces on each other are examples of:\",o:[\"Arthrokinematic motion\",\"Osteokinematic motion\",\"Degrees of freedom\",\"Synergistic dominance\"],e:\"Osteokinematic motion is the visible movement of bony segments. Arthrokinematic motion happens at the joint surfaces and can't be seen.\"},\n {c:\"tech\",s:\"nsca\",q:\"According to NSCA, which PNF technique is most effective?\",o:[\"Hold–relax with agonist contraction\",\"Hold–relax\",\"Contract–relax\",\"Ballistic PNF\"],e:\"Adding the agonist contraction during the final stretch beats either hold–relax or contract–relax alone.\"},\n {c:\"tech\",s:\"nsca\",q:\"In NSCA's terminology, the hold–relax technique uses which contraction of the stretched muscle?\",o:[\"Isometric\",\"Concentric\",\"Eccentric\",\"Isokinetic\"],e:\"NSCA contract–relax uses a concentric contraction. Watch out: NASM reverses the contraction types for HR and CR, so answer by the book the question comes from.\"},\n {c:\"tech\",s:\"nasm\",q:\"Why did NASM move away from the term myofascial release?\",o:[\"Evidence doesn't support fascia actually being released; effects are likely neurological\",\"Rollers can't apply enough pressure to affect muscle\",\"Research showed rolling reduces force output\",\"The technique was shown to create adhesions\"],e:\"Behm and Wilke (2019). More plausible mechanisms include changes in parasympathetic-driven muscle tone, reflexes, and pain tolerance.\"},\n {c:\"tech\",s:\"nsca\",q:\"MacDonald et al. found that about 2 minutes of slow rolling on a high-pressure roller:\",o:[\"Raised quadriceps ROM to levels similar to static stretching, with no effect on force\",\"Reduced force output as much as static stretching\",\"Had no effect on ROM\",\"Only raised ROM when combined with PNF\"],e:\"That combination, range gains without force loss, is why rolling fits almost anywhere in a session.\"},\n {c:\"tech\",s:\"nsca\",q:\"Why doesn't NSCA recommend ballistic stretching for tactical athletes?\",o:[\"It triggers the stretch reflex and risks connective tissue trauma, soreness, and injury\",\"It takes too long to perform\",\"It requires a trained partner\",\"It lowers body temperature before activity\"],e:\"Bouncing past end range keeps the stretch reflex firing so the muscle can't relax, and it can cause more pain and microtears.\"},\n {c:\"tech\",s:\"nasm\",q:\"NASM's static and active stretches use the same positions. What's the difference?\",o:[\"Static holds at least 30 s; active holds 1–2 s for 5–10 reps\",\"Static needs a partner; active doesn't\",\"Active holds 30–60 s; static holds 1–2 s\",\"Static targets fascia; active targets tendons\"],e:\"Active stretching uses agonists and synergists to move into range, which reciprocally inhibits the target muscle. Use it before competition or high-intensity work.\"},\n {c:\"dose\",s:\"nasm\",q:\"What contraction intensity does NASM's chapter give for CRAC-style assisted stretching?\",o:[\"40–70% of MVIC\",\"About 20% of MVIC\",\"80–100% of MVIC\",\"5–10% of MVIC\"],e:\"Lim (2018): moderate intensity creates a training effect while limiting load on the tissue. The assisted-stretching video used about 20%, but the textbook answer is 40–70%.\"},\n {c:\"dose\",s:\"nasm\",q:\"What SMT dose per muscle does NASM recommend?\",o:[\"30–60 s, no more than 120 s\",\"15–30 s, no more than 60 s\",\"2–5 minutes\",\"5–10 s\"],e:\"Hold tender spots at least 30 s; 5–10 minutes total per session. The 15–30 s figure is NSCA's rolling time per area.\"},\n {c:\"dose\",s:\"nsca\",q:\"How long does NSCA say to roll each area?\",o:[\"15–30 s; hold very sensitive spots 30–60 s\",\"30–60 s; hold very sensitive spots 90 s\",\"5–10 s\",\"2 minutes\"],e:\"Compare NASM SMT: 30–60 s per muscle, no more than 120 s.\"},\n {c:\"dose\",s:\"nasm\",q:\"At what hold duration does NASM say static stretching mainly impairs strength and power?\",o:[\"2 minutes or longer\",\"15 seconds or longer\",\"30 seconds or longer\",\"Any duration\"],e:\"Impairment mostly occurs with holds of 2 minutes or more, used occasionally, as the only prep. Keep pre-activity holds under 60 s and follow with dynamic work.\"},\n {c:\"dose\",s:\"nasm\",q:\"What is NASM's dynamic stretching dose?\",o:[\"1–2 sets of 10–15 reps, 3–10 exercises\",\"4–5 sets of 30–60 s\",\"1 set of 8–10 reps with a 1–2 s hold\",\"3–6 sets of 30–120 s\"],e:\"The distractors are NSCA static stretching, Stick Mobility, and vibration.\"},\n {c:\"dose\",s:\"nsca\",q:\"What does NSCA call the most suitable dose to reduce passive resistance and increase flexibility in a recovery session?\",o:[\"4–5 sets of 60 s bilateral static stretches\",\"1 set of 30 s\",\"2 sets of 45 s\",\"10 sets of 10 s\"],e:\"2 sets of 45 s is NASM's Table 9.1 static example, not NSCA's recovery dose.\"},\n {c:\"dose\",s:\"nasm\",q:\"Beyond what weekly stretching volume does NASM report minimal additional benefit?\",o:[\"About 10 minutes per week\",\"About 2 minutes per week\",\"About 30 minutes per week\",\"About 60 minutes per week\"],e:\"Thomas et al. (2018): at least 5 minutes per week beats less, but more than 10 minutes adds little.\"},\n {c:\"dose\",s:\"nasm\",q:\"What is the Stick Mobility prescription?\",o:[\"1 set, 8–10 reps, 1–2 s end-range hold\",\"2 sets, 45 s holds\",\"1–2 reps of 30–60 s\",\"3–5 contractions, 2–5 sets\"],e:\"Use 3–10 Stick Mobility exercises. The other options are Table 9.1 static, percussion, and PNF per Kurz.\"},\n {c:\"dose\",s:\"nsca\",q:\"How are NSCA mobility hurdles set up?\",o:[\"4–6 hurdles, 2 ft (61 cm) apart, alternating mid-thigh and waist height\",\"8–10 hurdles, 1 ft apart, all at knee height\",\"4–6 hurdles, 4 ft apart, all at waist height\",\"2–3 hurdles at groin height\"],e:\"Low hurdles sit at mid-thigh and high hurdles at waist. The 1 ft (30 cm), just-below-groin figure is the high step drill.\"},\n {c:\"prog\",s:\"nasm\",q:\"What is NASM's order for an integrated flexibility sequence?\",o:[\"SMT → static → dynamic → sport-specific movement\",\"Static → SMT → dynamic → sport-specific movement\",\"Dynamic → static → SMT → sport-specific movement\",\"SMT → dynamic → static → sport-specific movement\"],e:\"Inhibit with SMT, lengthen overactive tissue with static stretching, then activate and integrate with dynamic and sport-specific work.\"},\n {c:\"prog\",s:\"nsca\",q:\"Where does NSCA place static and PNF stretching for tactical athletes?\",o:[\"In the cool-down or a separate session\",\"At the start of the warm-up\",\"Between maximal sprints\",\"Immediately before a fitness test\"],e:\"Pre-exercise static stretching may reduce force, jump height, and sprint speed. Before training, NSCA uses a 10–15 minute dynamic warm-up.\"},\n {c:\"prog\",s:\"nasm\",q:\"An assessment shows knee valgus. Which muscles does NASM suggest are likely overactive?\",o:[\"Gastrocnemius, adductors, and tensor fascia latae\",\"Gluteus maximus and gluteus medius\",\"Latissimus dorsi and pectorals\",\"Rectus abdominis and obliques\"],e:\"Stretch what's overactive, like the calves and adductors, and strengthen what's underactive.\"},\n {c:\"prog\",s:\"nasm\",q:\"What does NASM say about stretching underactive or lengthened muscles that have no ROM deficit?\",o:[\"It is illogical and possibly counterproductive\",\"It is the best way to balance the joint\",\"It is required before resistance training\",\"It only matters for older athletes\"],e:\"Target the overactive muscles an assessment identifies.\"},\n {c:\"prog\",s:\"nsca\",q:\"Why does NSCA treat mobility as a priority in its own right for tactical athletes?\",o:[\"Call-outs like alarms or forced entry allow no warm-up, so baseline mobility must already be there\",\"Tactical athletes can't safely do resistance training\",\"PNF replaces the need for strength work\",\"Static stretching reliably improves sprint speed\"],e:\"When there's no time to prepare, performance and injury risk depend on the flexibility and mobility the athlete already has.\"}\n];\n\nconst ORDERS = [\n { t: \"Cumulative injury cycle, starting from tissue trauma\", s: [\"Tissue trauma\",\"Inflammation\",\"Muscle spasm\",\"Adhesions\",\"Altered neuromuscular control\",\"Muscle imbalance\"] },\n { t: \"Muscle imbalance chain\", s: [\"Muscle imbalance\",\"Altered reciprocal inhibition\",\"Synergistic dominance\",\"Joint dysfunction\",\"Poor neuromuscular efficiency\"] },\n { t: \"NASM integrated flexibility sequence\", s: [\"Self-myofascial techniques\",\"Static stretching\",\"Dynamic stretching\",\"Sport- or skill-specific movement\"] },\n { t: \"NSCA hold–relax with agonist contraction\", s: [\"Passive stretch, 10 s\",\"Isometric contraction, ~6 s\",\"Relax\",\"Agonist contraction during 30 s restretch\"] },\n { t: \"NASM CRAC protocol\", s: [\"Move to end range\",\"Contract at 40–70% MVIC\",\"Move to a new end range\",\"Hold 20–30 s\"] },\n { t: \"NSCA tactical training day\", s: [\"Dynamic warm-up (10–15 min)\",\"Focus of the day\",\"Mobility or SMR between sets\",\"Static or PNF cool-down\",\"Recovery session\"] },\n { t: \"Muscle connective tissue, outermost to innermost\", s: [\"Epimysium\",\"Perimysium\",\"Endomysium\"] },\n { t: \"Joint stiffness contributors, largest to smallest\", s: [\"Joint capsule and ligaments\",\"Muscle fascia\",\"Tendons\",\"Skin\"] }\n];\n\nconst GL_GROUPS = [[\"all\",\"All terms\"],[\"defs\",\"Definitions & factors\"],[\"neuro\",\"Nervous system\"],[\"tissue\",\"Muscle & fascia\"],[\"dys\",\"Dysfunction\"],[\"tech\",\"Techniques\"]];\n\nconst GLOSS = [\n [\"defs\",\"Flexibility (NSCA)\",\"The ability of muscles and tendons to move through the full range of motion about a joint; typically single-joint.\"],\n [\"defs\",\"Flexibility (NASM)\",\"The normal extensibility of soft tissues that allows full range of motion of a joint.\"],\n [\"defs\",\"Mobility (NSCA)\",\"The coordination and efficiency of movement through joint range of motion, usually multi-joint and without compensation.\"],\n [\"defs\",\"Mobility (NASM)\",\"The ability of a joint to move through its full range of motion with control and stability; the ability to move freely.\"],\n [\"defs\",\"Range of motion (ROM)\",\"How far a joint or body segment can move, usually measured in degrees.\"],\n [\"defs\",\"Active ROM\",\"Range achieved with your own voluntary muscle contractions.\"],\n [\"defs\",\"Passive ROM\",\"Range achieved without muscle contraction, with an external force such as a coach or trainer. Usually greater than active.\"],\n [\"defs\",\"Degrees of freedom (DOF)\",\"The number of independent directions a joint can move.\"],\n [\"defs\",\"Hypermobility\",\"Joint movement beyond normal range; clinically, a hereditary connective tissue disorder with instability and chronic pain.\"],\n [\"defs\",\"Physiological factors\",\"Age, sex, physical activity level, and body composition.\"],\n [\"defs\",\"Kinesiological factors\",\"Muscle and tendon origin and insertion, joint structure and integrity, and muscle cross-sectional area.\"],\n [\"defs\",\"Sarcopenia\",\"Age-related loss of muscle tissue.\"],\n [\"defs\",\"Fibrosis\",\"Fibrous connective tissue replacing degenerating muscle, which is less pliable and stiffens the joint.\"],\n [\"defs\",\"Arthritis\",\"Joint pain and stiffness.\"],\n [\"defs\",\"Adaptive shortening\",\"Tightness from a muscle staying in a shortened position, such as prolonged sitting.\"],\n [\"defs\",\"Overstretching\",\"Stretching past what the joint's less-elastic structures can tolerate, which can create instability.\"],\n [\"neuro\",\"Proprioception\",\"The body's sense of its orientation and the relative position of its parts.\"],\n [\"neuro\",\"Mechanoreceptors\",\"Structures that respond to mechanical forces such as touch and pressure and relay signals through sensory nerves.\"],\n [\"neuro\",\"Mechanotransduction\",\"Cells converting mechanical stimuli into electrochemical signals that trigger cellular responses.\"],\n [\"neuro\",\"Muscle spindle\",\"Sensory receptor within and parallel to muscle fibers that detects length and rate of length change.\"],\n [\"neuro\",\"Stretch reflex\",\"A spindle-driven signal that makes a rapidly lengthened muscle contract to prevent overstretching.\"],\n [\"neuro\",\"Golgi tendon organ (GTO)\",\"Sensory receptor at the musculotendinous junction sensitive to tension and rate of tension change.\"],\n [\"neuro\",\"Autogenic inhibition\",\"Tension-sensing impulses outweigh the impulses driving contraction, inhibiting the muscle. Also called the inverse myotatic or inverse stretch reflex.\"],\n [\"neuro\",\"Reciprocal inhibition\",\"When an agonist contracts, its functional antagonist receives an inhibitory signal and lengthens.\"],\n [\"neuro\",\"Lengthening reaction\",\"The cascade of neural reactions that allows a lengthened muscle to be stretched.\"],\n [\"neuro\",\"Inhibition\",\"Active suppression of motor neuron activity by inhibitory interneurons.\"],\n [\"neuro\",\"Disfacilitation\",\"Passive reduction of excitatory input to motor neurons, as in a long passive hold.\"],\n [\"neuro\",\"Tonic reflexes\",\"Involuntary, automatic muscle responses to stimuli like changes in position or muscle length.\"],\n [\"neuro\",\"Stretch tolerance\",\"The ability to tolerate stretching sensations so end-range discomfort feels less; a learned dissociation of discomfort from injury.\"],\n [\"neuro\",\"Joint receptors\",\"Receptors in and around the joint capsule responding to pressure, acceleration, and deceleration; most active near end range.\"],\n [\"neuro\",\"Ruffini endings\",\"Slow-adapting encapsulated receptors in the dermis, subcutaneous and connective tissue, and joint capsule that respond to stretch.\"],\n [\"neuro\",\"Free nerve endings\",\"Unencapsulated endings in skin, ligaments, tendons, and capsule that detect temperature, pressure, pain, and mechanical stimuli.\"],\n [\"neuro\",\"Nociceptors\",\"Receptors in skin and fascia that respond to damage, pain, or perceived danger.\"],\n [\"neuro\",\"Cutaneous receptors\",\"Sensory endings in the skin that detect external stimuli, including skin tension changes during movement.\"],\n [\"tissue\",\"Fascicle\",\"A bundle of muscle fibers surrounded by perimysium.\"],\n [\"tissue\",\"Epimysium\",\"Connective tissue enclosing the entire muscle.\"],\n [\"tissue\",\"Perimysium\",\"Connective tissue surrounding each fascicle.\"],\n [\"tissue\",\"Endomysium\",\"Connective tissue around each individual muscle fiber.\"],\n [\"tissue\",\"Parallel elastic component (PEC)\",\"The passive elastic properties of muscle from connective tissue running parallel to the fibers.\"],\n [\"tissue\",\"Fascia\",\"Connective tissue surrounding muscles and bones, made of cells, fibers, and ground substance.\"],\n [\"tissue\",\"Myofascia\",\"Muscle and fascia together. Most of its stiffness comes from the fascia.\"],\n [\"tissue\",\"Collagen\",\"The body's most abundant protein; gives connective tissue strength and structure but restricts ROM.\"],\n [\"tissue\",\"Elastin\",\"A protein that gives skin, tendons, ligaments, and fascia elasticity.\"],\n [\"tissue\",\"Fibrous adhesions\",\"Areas where restricted fascia loses elasticity and binds together, reducing ROM and function.\"],\n [\"tissue\",\"Elasticity\",\"Soft tissue's ability to return to resting length after a stretch.\"],\n [\"tissue\",\"Plasticity\",\"Soft tissue's ability to permanently change shape.\"],\n [\"tissue\",\"Passive insufficiency\",\"A two-joint muscle's inability to lengthen enough across both joints at once.\"],\n [\"tissue\",\"Thixotropy\",\"Fascia becoming more fluid and less viscous when warmed or moved, as with rolling.\"],\n [\"dys\",\"Pattern overload\",\"Repeating the same pattern of motion or posture over long periods, leading to dysfunction or injury.\"],\n [\"dys\",\"Cumulative injury cycle\",\"Tissue trauma causes inflammation, spasm, adhesions, altered neuromuscular control, and imbalances that invite more trauma.\"],\n [\"dys\",\"Muscle imbalance\",\"A discrepancy in strength, flexibility, or function between antagonist or synergist groups.\"],\n [\"dys\",\"Altered reciprocal inhibition\",\"An overactive muscle chronically inhibits its antagonist, making it underactive.\"],\n [\"dys\",\"Synergistic dominance\",\"A synergist takes over as the primary mover because the prime mover is underperforming.\"],\n [\"dys\",\"Osteokinematic motion\",\"Visible limb movement such as flexion, extension, abduction, and rotation.\"],\n [\"dys\",\"Arthrokinematic motion\",\"Movement of joint surfaces on each other: roll, slide, and spin.\"],\n [\"dys\",\"Neuromuscular efficiency\",\"The nervous system's ability to activate the right muscles with the right force for the task.\"],\n [\"tech\",\"Static stretching\",\"Passively lengthening a muscle to the point of tension and holding it for a sustained time.\"],\n [\"tech\",\"Active stretching\",\"Using agonists and synergists to move a joint into range, holding 1–2 s for 5–10 reps.\"],\n [\"tech\",\"Dynamic stretching\",\"Using muscle force and body momentum to take a joint through its full available range.\"],\n [\"tech\",\"Ballistic stretching\",\"Bouncing, swinging, or jerking movements that exceed end range without holding; triggers the stretch reflex.\"],\n [\"tech\",\"Proprioceptive neuromuscular facilitation (PNF)\",\"Stretching that uses muscle contractions and relaxation, usually with a partner, to increase ROM.\"],\n [\"tech\",\"Assisted stretching\",\"Flexibility training with help from a partner, coach, or therapist to stretch more effectively.\"],\n [\"tech\",\"CRAC\",\"Contract–relax–agonist–contract: contract the stretched muscle, then contract the opposing muscle to move deeper.\"],\n [\"tech\",\"Myofascial release (MR)\",\"Manual therapy developed by Barnes to relieve adhesions in fascia through massage or trigger-point pressure.\"],\n [\"tech\",\"Self-myofascial release (SMR)\",\"Myofascial release you apply yourself with a foam roller or dense ball.\"],\n [\"tech\",\"Self-myofascial techniques (SMT)\",\"NASM's term for user-directed techniques like rolling and self-massage aimed at adhesions and tissue restrictions.\"],\n [\"tech\",\"Instrument-assisted soft tissue mobilization (IASTM)\",\"Using specially designed instruments to mobilize scar tissue and myofascial adhesions.\"],\n [\"tech\",\"Vibratory analgesia\",\"Vibration stimulating mechanoreceptors that temporarily interfere with pain sensation.\"],\n [\"tech\",\"Post-activation potentiation\",\"An acute increase in force generation resulting from prior muscle contraction.\"],\n [\"tech\",\"Stretch-induced strength loss\",\"Reduced force, power, and speed after pre-exercise static stretching, linked to reduced neural activation.\"],\n [\"tech\",\"Dynamic warm-up (NSCA)\",\"A 5–10 minute general aerobic warm-up combined with a dynamic flexibility routine.\"],\n [\"tech\",\"Movement preparation\",\"A tailored warm-up sequence of SMT, static stretching if needed, then dynamic stretching.\"]\n];\n\nconst FILTERS = [[\"all\",\"All\"],[\"static\",\"Static & active\"],[\"pnf\",\"PNF & assisted\"],[\"mobility\",\"Mobility circuits\"],[\"yoga\",\"Yoga\"],[\"dynamic\",\"Dynamic\"],[\"roll\",\"Rolling & SMT\"],[\"perc\",\"Percussion\"],[\"stick\",\"Stick Mobility\"]];\n\nconst TOC = [\n  [\"Foundations\", [[\"#objectives\",\"Objectives & map\"],[\"#terms\",\"Defining the terms\"],[\"#factors\",\"What shapes flexibility\"]]],\n  [ \" ? QUIZ.length : QUIZ.filter(q => q.c === f[0]).length) + \")\",\n      style: this.chipStyle((this.state.quizCat || \"all\") === f[0])\n    }));\n    vals.setQuizCat = e => {\n      const k = e.currentTarget.dataset.k;\n      this.setState({ quizCat: k, quiz: this.buildQuiz(k) });\n    };\n    if (qz && qz.list.length) {\n      const item = qz.list[qz.idx];\n      const right = qz.results.filter(r => r).length;\n      vals.quizActive = !qz.done;\n      vals.quizDone = qz.done;\n      vals.quizMeta = \"Question \" + (qz.idx + 1) + \" of \" + qz.list.length + \" · \" + qcatName[item.q.c];\n      vals.quizScore = \"Score \" + right + \"/\" + qz.results.length;\n      vals.quizSrc = item.q.s;\n      vals.quizSrcLabel = item.q.s === \"both\" ? \"Both\" : item.q.s.toUpperCase();\n      vals.quizText = item.q.q;\n      vals.quizOpts = item.opts.map((o, k) => ({\n        label: o.t, k: String(k),\n        style: \"font:inherit;text-align:left;border-radius:8px;padding:.6rem .8rem;cursor:\" + (qz.pick == null ? \"pointer\" : \"default\") + \";color:var(--ink);border:1.5px solid \" +\n          (qz.pick != null && o.ok ? \"var(--green)\" : qz.pick === k && !o.ok ? \"var(--red-strong)\" : \"var(--line)\") + \";background:\" +\n          (qz.pick != null && o.ok ? \"var(--green-soft)\" : qz.pick === k && !o.ok ? \"var(--red-wrong)\" : \"var(--paper)\")\n      }));\n      vals.quizAnswered = qz.pick != null;\n      vals.quizVerdict = qz.pick != null ? (item.opts[qz.pick].ok ? \"Correct.\" : \"Not quite.\") : \"\";\n      vals.quizVerdictStyle = \"font-weight:700;color:\" + (qz.pick != null && item.opts[qz.pick].ok ? \"var(--green)\" : \"var(--red-strong)\");\n      vals.quizExplain = item.q.e;\n      vals.quizNextLabel = qz.idx < qz.list.length - 1 ? \"Next question\" : \"See results\";\n      vals.pickQuiz = e => {\n        if (this.state.quiz.pick != null) return;\n        const k = +e.currentTarget.dataset.k;\n        const q2 = this.state.quiz;\n        this.setState({ quiz: Object.assign({}, q2, { pick: k, results: q2.results.concat([q2.list[q2.idx].opts[k].ok]) }) });\n      };\n      vals.nextQuiz = () => {\n        const q2 = this.state.quiz;\n        if (q2.idx < q2.list.length - 1) this.setState({ quiz: Object.assign({}, q2, { idx: q2.idx + 1, pick: null }) });\n        else this.setState({ quiz: Object.assign({}, q2, { done: true }) });\n      };\n      const by = {};\n      qz.results.forEach((ok, i) => {\n        const c = qz.list[i].q.c;\n        by[c] = by[c] || [0, 0];\n        by[c][1]++;\n        if (ok) by[c][0]++;\n      });\n      vals.quizTotal = \"You scored \" + right + \" of \" + qz.results.length + (qz.results.length ? \" (\" + Math.round(100 * right / qz.results.length) + \"%)\" : \"\");\n      vals.quizBreakdown = QCATS.filter(c => by[c[0]]).map(c => {\n        const p = Math.round(100 * by[c[0]][0] / by[c[0]][1]);\n        return { label: c[1], score: by[c[0]][0] + \" of \" + by[c[0]][1] + \" (\" + p + \"%)\", barStyle: \"display:block;height:100%;width:\" + p + \"%;background:\" + (p >= 80 ? \"var(--green)\" : p >= 60 ? \"var(--amber)\" : \"var(--red-strong)\") };\n      });\n      const weak = QCATS.filter(c => by[c[0]] && by[c[0]][0] / by[c[0]][1] < 0.8).map(c => c[1]);\n      vals.quizAdvice = weak.length ? \"Worth another pass: \" + weak.join(\", \") + \".\" : \"Every category at 80% or better.\";\n      vals.retakeQuiz = () => this.setState({ quiz: this.buildQuiz(this.state.quizCat || \"all\") });\n      const missed = qz.results.map((ok, i) => (ok ? null : qz.list[i].q)).filter(Boolean);\n      vals.missedCount = missed.length ? \"Retake the \" + missed.length + \" I missed\" : \"\";\n      vals.hasMissed = missed.length > 0;\n      vals.retakeMissed = () => this.setState({ quiz: this.buildQuiz(this.state.quizCat || \"all\", this.shuffle(missed)) });\n    } else {\n      vals.quizActive = false;\n      vals.quizDone = false;\n    }\n    for (let i = 0; i < 4; i++) {\n      vals[\"pnfIs\" + i] = (this.state.pnf || 0) === i;\n      vals[\"pnfBtn\" + i] = this.chipStyle((this.state.pnf || 0) === i);\n    }\n    vals.setImp = e => this.setState({ imp: +e.currentTarget.dataset.i });\n    vals.setPlan = e => this.setState({ plan: +e.currentTarget.dataset.i });\n    for (let i = 0; i < 5; i++) {\n      vals[\"chainIs\" + i] = this.state.chain === i;\n      vals[\"chainBtn\" + i] = this.pickStyle(this.state.chain === i, \"var(--red)\");\n    }\n    for (let i = 0; i < 4; i++) {\n      vals[\"impIs\" + i] = this.state.imp === i;\n      vals[\"impBtn\" + i] = this.chipStyle(this.state.imp === i);\n    }\n    for (let i = 0; i < 6; i++) {\n      vals[\"planIs\" + i] = this.state.plan === i;\n      vals[\"planBtn\" + i] = this.chipStyle(this.state.plan === i);\n    }\n    secs.forEach(s => {\n      const key = s.charAt(0).toUpperCase() + s.slice(1);\n      vals[\"rev\" + key] = done.has(s) ? revOn : revOff;\n      vals[\"rev\" + key + \"Label\"] = done.has(s) ? \"Reviewed ✓\" : \"Mark reviewed\";\n    });\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
