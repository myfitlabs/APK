ve tissue<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Elastin<\u002Fsc-raw-td><sc-raw-td>Fiber<\u002Fsc-raw-td><sc-raw-td>Lets connective tissue lengthen<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Collagen<\u002Fsc-raw-td><sc-raw-td>Fiber<\u002Fsc-raw-td><sc-raw-td>Strength and structure; the most abundant protein in the body<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>How well fascial surfaces slide and how much elastin they contain determine fascial mobility (Langevin, 2021). Muscle plus fascia is <strong>myofascia<\u002Fstrong>, and most of its stiffness comes from the fascia. Static stretching doesn't change tendon stiffness (Konrad &amp; Tilp, 2014), so tendons should be discussed separately from the PEC when talking about \"muscle\" stiffness.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--blue);background:var(--blue-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">NSCA on fascia<\u002Fspan>Fascia's elasticity gives it the greatest potential for stretch. Injury, disease, inactivity, or inflammation can make it lose elasticity and bind into <strong>fibrous adhesions<\u002Fstrong>, which can be painful and reduce ROM, muscle length, strength, endurance, motor coordination, and soft tissue extensibility.<\u002Fdiv>\n\n        <h3>Myofascial lines<\u002Fh3>\n        <p>Whole-body chains of fascia documented in cadaver dissection. Their continuity may explain why stretching one region can improve ROM somewhere it wasn't directly stretched (Wilke et al., 2016). These models remain <strong>theoretical<\u002Fstrong> in living humans (Bordoni &amp; Myers, 2020).<\u002Fp>\n\n        <h3>Passive tension and passive insufficiency<\u002Fh3>\n        <p>Fascial elements supply much of the passive resistance plotted on a passive length–tension curve. With training, tissue resists less at a given point in the range.<\u002Fp>\n        <p><strong>Passive insufficiency<\u002Fstrong> is a two-joint muscle's inability to lengthen enough across both joints at once. Lying supine, you get far more hip flexion with the knee bent than straight, because a straight knee stretches the hamstrings across both hip and knee. Regular stretching improves it.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Elasticity<\u002Fh4><p style=\"margin-bottom:0\">Soft tissue's ability to return to resting length after a stretch.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Plasticity<\u002Fh4><p style=\"margin-bottom:0\">Soft tissue's ability to change shape permanently.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:.92rem;color:var(--muted)\">Tensile forces pull in opposite directions to elongate tissue. Pulling a rubber band is a good model: the growing resistance is like passive muscle tension during a stretch.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"tissue\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revTissue }}\">{{ revTissueLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">When movement breaks down<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">NASM's rationale for integrated flexibility training: repetitive stress creates imbalances, and imbalances cascade down the kinetic chain.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"overload\" data-screen-label=\"Pattern overload\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>Pattern overload and the cumulative injury cycle<\u002Fh2>\n\n        <h3>Pattern overload <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Repeating the same joint actions and contractions over long periods can unbalance muscle groups and lead to dysfunction or injury. Athletes are especially exposed because they rehearse the same routines along the same lines of tension with little variety.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Setting<\u002Fsc-raw-th><sc-raw-th>Example<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Endurance running and repetitive occupations<\u002Fsc-raw-td><sc-raw-td>Constant repetition of the same sequence<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Baseball pitching<\u002Fsc-raw-td><sc-raw-td>Elbow valgus extension overload<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Golf<\u002Fsc-raw-td><sc-raw-td>Intersection syndrome<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Wrestling<\u002Fsc-raw-td><sc-raw-td>Freestyle wrestlers show more thoracic kyphosis than Greco-Roman wrestlers from time spent hunched<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Prolonged sitting<\u002Fsc-raw-td><sc-raw-td>A static posture counts as a pattern too; linked to shoulder, low back, thigh, and knee symptoms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>Repetitive contractions or sustained postures with little rest can also cause localized ischemia and elevated fatigue.<\u002Fp>\n\n        <h3>The cumulative injury cycle <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Poor posture and repetitive overuse create connective tissue dysfunction that eventually becomes injury. The body's repair response then sets up the next injury.<\u002Fp>\n        <figure style=\"margin:1.2rem 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem\">\n          <div style=\"position:relative;width:100%;max-width:600px;margin:0 auto;padding-top:66.6%\">\n            <svg sc-camel-view-box=\"0 0 600 400\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n              <ellipse cx=\"300\" cy=\"200\" rx=\"210\" ry=\"135\" fill=\"none\" stroke=\"var(--line-strong)\" stroke-width=\"2\"><\u002Fellipse>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(405 83.1) rotate(20.4)\" fill=\"var(--red)\"><\u002Fpath>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(510 200) rotate(90)\" fill=\"var(--red)\"><\u002Fpath>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(405 316.9) rotate(159.6)\" fill=\"var(--red)\"><\u002Fpath>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(195 316.9) rotate(-159.6)\" fill=\"var(--red)\"><\u002Fpath>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(90 200) rotate(-90)\" fill=\"var(--red)\"><\u002Fpath>\n              <path d=\"M -8 -7 L 8 0 L -8 7 Z\" transform=\"translate(195 83.1) rotate(-20.4)\" fill=\"var(--red)\"><\u002Fpath>\n            <\u002Fsvg>\n            <div style=\"position:absolute;left:50%;top:16%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;white-space:nowrap\">Tissue trauma<\u002Fdiv>\n            <div style=\"position:absolute;left:80%;top:33%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;white-space:nowrap\">Inflammation<\u002Fdiv>\n            <div style=\"position:absolute;left:80%;top:67%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;white-space:nowrap\">Muscle spasm<\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;white-space:nowrap\">Adhesions<\u002Fdiv>\n            <div style=\"position:absolute;left:20%;top:67%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;text-align:center;max-width:9rem\">Altered neuromuscular control<\u002Fdiv>\n            <div style=\"position:absolute;left:20%;top:33%;transform:translate(-50%,-50%);background:var(--card);border:1.8px solid var(--rule);border-radius:6px;padding:.35rem .6rem;font-weight:700;font-size:.9rem;text-align:center;max-width:9rem\">Muscle imbalance<\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:.88rem;text-align:center\">Repeats and<br>compounds<\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption>Tissue trauma induces inflammation, spasm, adhesions, altered neuromuscular control, and imbalances, which raise the risk of the next trauma.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <p>What keeps the cycle turning:<\u002Fp>\n        <ul>\n          <li><strong>Sensitization.<\u002Fstrong> Pain receptors in damaged or overloaded areas become oversensitive to chemicals released by those cells, so normally harmless stimuli start to hurt.<\u002Fli>\n          <li><strong>Fear avoidance.<\u002Fstrong> Athletes cut or stop training, which lets stiff fibrotic tissue form between layers that should glide.<\u002Fli>\n          <li><strong>Repeated trauma.<\u002Fstrong> Each injury lays down more stiff, inelastic fibrotic tissue.<\u002Fli>\n          <li><strong>Immobilization.<\u002Fstrong> Casting or bracing a limb loses ROM and adds tightness, possibly from losing sarcomeres in series or from the CNS continuing to guard the area.<\u002Fli>\n        <\u002Ful>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"overload\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revOverload }}\">{{ revOverloadLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"imbalance\" data-screen-label=\"Muscle imbalance chain\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>The muscle imbalance chain<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">A muscle imbalance is a mismatch in strength, flexibility, or function between antagonist or synergist groups. It can be caused by repetitive patterns and can also start the cumulative injury cycle.<\u002Fp>\n\n        <h3>Two hypotheses for where imbalances come from<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Biomechanical origin<\u002Fh4><p style=\"margin-bottom:0\">Repetitive movements and prolonged postures change muscle length and strength, leading to dysfunction along the kinetic chain and abnormal joint stress (Sahrmann et al., 2017). Connects to pattern overload injuries.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Neurological origin<\u002Fh4><p style=\"margin-bottom:0\">Some people are neurologically predisposed. Proposed by Czech physician <strong>Vladimir Janda<\u002Fstrong> (1978): an impaired relationship between tight or short muscles and excessively inhibited muscles.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p>Imbalances also occur side to side. Young adults show large strength differences between dominant and nondominant hip abductors, which can alter gait and raise injury risk. Most likely, imbalances come from a mix of both mechanisms.<\u002Fp>\n\n        <h3>Common causes<\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Pattern overload<\u002Fsc-raw-td><sc-raw-td>Same motions or postures repeated with little variation.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Poor technical skill<\u002Fsc-raw-td><sc-raw-td>Inefficient technique overloads some muscles (regional tightness) and underuses others (weakness). Golf swings and throwing are especially prone. Correcting imbalances restores full ROM and more efficient form.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Aging<\u002Fsc-raw-td><sc-raw-td>Loss of elasticity, muscle mass, joint integrity, and motor neurons, plus years of habits and injuries.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Lack of recovery<\u002Fsc-raw-td><sc-raw-td>Tissues can't regenerate between sessions, become overactive and short, and push their antagonists into underactivity.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:9rem\">Lack of core strength<\u002Fsc-raw-td><sc-raw-td>Weak <strong>lumbar multifidus<\u002Fstrong> and <strong>transverse abdominis<\u002Fstrong> are a primary contributor to anterior pelvic tilt and excess lumbar extension (Takaki et al., 2016).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n\n        <h3>How one imbalance cascades<\u002Fh3>\n        <p>Select each step. The example follows one athlete with an anterior pelvic tilt through the whole chain.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .6rem\">\n          <button type=\"button\" data-i=\"0\" sc-camel-on-click=\"{{ setChain }}\" style=\"{{ chainBtn0 }}\"><span style=\"font-family:'Anybody',Arial,sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1;color:var(--muted);margin-bottom:.2rem\">1<\u002Fspan>Muscle imbalance<\u002Fbutton>\n          <button type=\"button\" data-i=\"1\" sc-camel-on-click=\"{{ setChain }}\" style=\"{{ chainBtn1 }}\"><span style=\"font-family:'Anybody',Arial,sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1;color:var(--muted);margin-bottom:.2rem\">2<\u002Fspan>Altered reciprocal inhibition<\u002Fbutton>\n          <button type=\"button\" data-i=\"2\" sc-camel-on-click=\"{{ setChain }}\" style=\"{{ chainBtn2 }}\"><span style=\"font-family:'Anybody',Arial,sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1;color:var(--muted);margin-bottom:.2rem\">3<\u002Fspan>Synergistic dominance<\u002Fbutton>\n          <button type=\"button\" data-i=\"3\" sc-camel-on-click=\"{{ setChain }}\" style=\"{{ chainBtn3 }}\"><span style=\"font-family:'Anybody',Arial,sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1;color:var(--muted);margin-bottom:.2rem\">4<\u002Fspan>Joint dysfunction<\u002Fbutton>\n          <button type=\"button\" data-i=\"4\" sc-camel-on-click=\"{{ setChain }}\" style=\"{{ chainBtn4 }}\"><span style=\"font-family:'Anybody',Arial,sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1;color:var(--muted);margin-bottom:.2rem\">5<\u002Fspan>Poor neuromuscular efficiency<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;min-height:7rem\">\n          <sc-if value=\"{{ chainIs0 }}\" hint-placeholder-val=\"{{ true }}\"><div>\n            <h4 style=\"margin-top:0\">1. Muscle imbalance<\u002Fh4>\n            <p>A mismatch in strength, flexibility, or function between antagonist or synergist muscles. Caused by pattern overload, poor technique, aging, lack of recovery, or weak core, and able to start the cumulative injury cycle.<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>In the example athlete:<\u002Fstrong> Hip flexors are chronically overactive and short, pulling the pelvis into an anterior tilt.<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Next: Altered reciprocal inhibition →<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ chainIs1 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">2. Altered reciprocal inhibition<\u002Fh4>\n            <p>Reciprocal inhibition normally keeps agonists and antagonists in balance with task-dependent activation. An overactive muscle keeps inhibiting its antagonist, which becomes underactive.<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>In the example athlete:<\u002Fstrong> Constant hip flexor tone chronically inhibits the gluteus maximus (Mills et al., 2015).<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Next: Synergistic dominance →<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ chainIs2 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">3. Synergistic dominance<\u002Fh4>\n            <p>A synergist, which should only assist the prime mover, takes over as the main force producer because the prime mover isn't doing its job. The hamstrings and erector spinae are synergists to the gluteus maximus in hip extension.<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>In the example athlete:<\u002Fstrong> When running or jumping, the inhibited glute max can't produce enough force, so the hamstrings ramp up. The athlete reports 'tight' hamstrings. Early in the running swing, the lumbar extensors may also pitch in by increasing anterior pelvic tilt.<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Next: Joint dysfunction →<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ chainIs3 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">4. Joint dysfunction<\u002Fh4>\n            <p>A synergist pulling on the bone harder than the prime mover changes how the joint moves, including arthrokinematic roll, slide, and spin that you can't see.<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>In the example athlete:<\u002Fstrong> The glute max's fiber arrangement and insertion let it stabilize the iliofemoral joint while extending the hip; the hamstrings don't do this. Hamstring-dominant hip extension produces aberrant motion at the iliofemoral and tibiofemoral joints.<\u002Fp>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Next: Poor neuromuscular efficiency →<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ chainIs4 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <h4 style=\"margin-top:0\">5. Poor neuromuscular efficiency<\u002Fh4>\n            <p>The nervous system stops recruiting the right muscles with the right force for the task. Compensations show up as poor landing mechanics, weak postural control, and abnormal activation patterns, raising injury risk and lowering performance.<\u002Fp>\n            <p style=\"margin-bottom:0\"><strong>In the example athlete:<\u002Fstrong> The coach connects the dots: restore gluteal strength and address the overactive hip flexors rather than just stretching the hamstrings. The sense of hamstring tightness should ease.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <h3>Osteokinematics versus arthrokinematics<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Osteokinematic<\u002Fh4><p style=\"margin-bottom:0\">\"Real motion\": the visible movement of bony segments, such as flexion, extension, abduction, adduction, and rotation.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Arthrokinematic<\u002Fh4><p style=\"margin-bottom:0\">Movement of one joint surface on another: <strong>roll, slide, and spin<\u002Fstrong>. Can't be seen or actively controlled.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Where flexibility training fits<\u002Fh3>\n        <p>Targeted stretching and dynamic mobility lengthen short, overactive muscles and restore balance. That relieves altered reciprocal inhibition, lets underactive muscles work again, stops synergists from taking over, and improves joint stability, cutting the risk of joint dysfunction and injury.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"imbalance\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revImbalance }}\">{{ revImbalanceLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">Techniques<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Every method in both chapters, what it does, and where it belongs in a session.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"menu\" data-screen-label=\"Methods compared\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>Stretching methods compared<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">NSCA names four main stretch types (static, ballistic, dynamic, PNF) plus myofascial release. NASM organizes around self-myofascial techniques, static, active, dynamic, and assisted stretching. All stretch types improve ROM; the right one depends on the goal and timing.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Method<\u002Fsc-raw-th><sc-raw-th>What it is<\u002Fsc-raw-th><sc-raw-th>Main proposed mechanism<\u002Fsc-raw-th><sc-raw-th>Where it goes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Static passive<\u002Fsc-raw-td><sc-raw-td>Slowly take the muscle to end range and hold without further movement. Low energy cost, easy to do safely.<\u002Fsc-raw-td><sc-raw-td>Spindle disfacilitation, stretch tolerance, increased compliance and viscoelastic change, longer fascicles<\u002Fsc-raw-td><sc-raw-td><span data-src=\"nsca\">NSCA<\u002Fspan> cool-down and between sessions<br><span data-src=\"nasm\">NASM<\u002Fspan> movement prep for overactive muscles, and after<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Static active<\u002Fsc-raw-td><sc-raw-td>Contract the opposing muscle group to reach end range, then hold the limb there.<\u002Fsc-raw-td><sc-raw-td>Reciprocal inhibition<\u002Fsc-raw-td><sc-raw-td>Same as static<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Active <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Agonists and synergists move the joint into range; brief hold; repeat. A progression from static.<\u002Fsc-raw-td><sc-raw-td>Reciprocal inhibition; raises motor neuron excitability<\u002Fsc-raw-td><sc-raw-td>Pre-activity warm-up<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Dynamic<\u002Fsc-raw-td><sc-raw-td>Controlled, activity-specific movement through range. NSCA describes it as forcefully controlled movement that exceeds end ROM.<\u002Fsc-raw-td><sc-raw-td>Reciprocal inhibition; neuromuscular activation; raises temperature and blood flow<\u002Fsc-raw-td><sc-raw-td>Before and during sessions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Ballistic<\u002Fsc-raw-td><sc-raw-td>Bouncing, swinging, or jerking with body weight; end point not held.<\u002Fsc-raw-td><sc-raw-td>Triggers the stretch reflex, which prevents relaxation<\u002Fsc-raw-td><sc-raw-td><span data-src=\"nsca\">NSCA<\u002Fspan> not recommended for tactical athletes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">PNF / assisted<\u002Fsc-raw-td><sc-raw-td>Passive stretch combined with contractions of the target or opposing muscle, usually with a partner.<\u002Fsc-raw-td><sc-raw-td>Autogenic and reciprocal inhibition, stretch tolerance, thixotropy<\u002Fsc-raw-td><sc-raw-td><span data-src=\"nsca\">NSCA<\u002Fspan> cool-down and between sessions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Yoga<\u002Fsc-raw-td><sc-raw-td>Blend of static and dynamic poses with focus on breathing and alignment; holds of 15–90 s.<\u002Fsc-raw-td><sc-raw-td>Lengthens muscles, relieves tension and soreness<\u002Fsc-raw-td><sc-raw-td>Recovery sessions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:8rem\">Myofascial / SMT<\u002Fsc-raw-td><sc-raw-td>Pressure from a therapist, roller, ball, or device.<\u002Fsc-raw-td><sc-raw-td><span data-src=\"nsca\">NSCA<\u002Fspan> releases adhesions<br><span data-src=\"nasm\">NASM<\u002Fspan> mainly neurological<\u002Fsc-raw-td><sc-raw-td>Anytime: warm-up, during, right after, or between sessions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Instructor responsibility <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fspan>Don't assume athletes know correct technique or are aware of bad habits. Using the right method at the wrong time, or with poor technique, raises injury risk and undercuts training goals.<\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"menu\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revMenu }}\">{{ revMenuLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"static\" data-screen-label=\"Static stretching debate\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Static stretching and the performance debate<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">This is the biggest disagreement in the module. NSCA leans cautious; NASM, citing newer systematic reviews, says short holds inside a full warm-up are fine.<\u002Fp>\n\n        <h3>How static stretching works<\u002Fh3>\n        <p><span data-src=\"nsca\">NSCA<\u002Fspan> A stretched muscle normally springs back to its original length. Holding for 15–90 seconds increases compliance, so it takes longer to return. Repeated over time, this may change the muscle's viscoelastic properties and explain ROM gains.<\u002Fp>\n        <p><span data-src=\"nasm\">NASM<\u002Fspan> Low force, longer duration. Holding the elongated position inhibits the spindle and triggers relaxation. Proposed mechanisms include reduced motor neuron excitation (neural inhibition and disfacilitation), longer muscle fascicles, and altered stretch tolerance.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--red);background:var(--red-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Boost it with the antagonist<\u002Fspan>Contracting the opposing muscle during a static hold may add reciprocal inhibition (Blazevich et al., 2012). Squeeze the glutes during a kneeling hip flexor stretch, or tense the quads during a hamstring stretch.<\u002Fdiv>\n\n        <h3>The two positions side by side<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:8px;padding:.9rem 1rem\">\n            <h4 style=\"margin-top:0\"><span data-src=\"nsca\">NSCA<\u002Fspan> Be cautious before activity<\u002Fh4>\n            <ul>\n              <li>Pre-exercise static stretching may lower maximal force, jump height, and sprint speed, slow reaction time, and impair balance.<\u002Fli>\n              <li>This <strong>stretch-induced strength loss<\u002Fstrong> is linked to reduced neural activation of the stretched muscle.<\u002Fli>\n              <li>Rubini et al. found significant strength reductions and concluded that jobs requiring strength and power may be compromised.<\u002Fli>\n              <li>Long-term performance effects are unknown.<\u002Fli>\n              <li>Often assumed to reduce injury risk, but there's no conclusive evidence.<\u002Fli>\n              <li><strong>Placement:<\u002Fstrong> cool-down or between sessions.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:.9rem 1rem\">\n            <h4 style=\"margin-top:0\"><span data-src=\"nasm\">NASM<\u002Fspan> Fine when short and followed by dynamic work<\u002Fh4>\n            <ul>\n              <li>Many studies show no acute strength or power loss. Impairment mainly occurs when holds are <strong>2 minutes or longer<\u002Fstrong>, used only occasionally, and done as the only prep before maximal effort. One study found explosive deficits lasting at least 24 hours (Haddad et al., 2014).<\u002Fli>\n              <li>Holds of <strong>30–60 s<\u002Fstrong>, done regularly and <strong>followed by dynamic activity<\u002Fstrong>, don't impair performance (Behm et al., 2016; Kay &amp; Blazevich, 2012; Reid et al., 2018).<\u002Fli>\n              <li>Keep pre-activity holds <strong>under 60 s per muscle<\u002Fstrong>.<\u002Fli>\n              <li>May reduce lower-body muscle and tendon injuries in high-velocity and change-of-direction sports (Behm et al., 2016; McHugh &amp; Cosgrave, 2009).<\u002Fli>\n              <li>Full warm-ups likely cancel deficits through <strong>post-activation potentiation<\u002Fstrong>, and stretching can boost athletes' confidence.<\u002Fli>\n              <li><strong>Placement:<\u002Fstrong> in movement prep, only on overactive muscles or joints needing sport-specific range.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">Answering exam questions<\u002Fspan>For NSCA, static and PNF stretching belong in the cool-down or between sessions, because they may not help force and power output. For NASM, static stretching belongs early in movement prep for overactive muscles only, held 30–60 s, then followed by dynamic stretching to restore motor neuron excitability.<\u002Fdiv>\n\n        <h3>Dosing static stretches <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>Intensity is a subjective rating of discomfort that depends on pain tolerance, so hold time is the more practical prescription. Research shows <strong>2–5 sets of 15–90 s<\u002Fstrong> reduces resistance to stretch and raises acute flexibility. NSCA suggests <strong>4–5 sets of 30–60 s<\u002Fstrong>.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">The time cost<\u002Fspan>Stretching the agonists and antagonists of every major segment at that dose can take 40–60 minutes. That has to be weighed against the other goals in the program.<\u002Fdiv>\n        <p style=\"font-size:.92rem;color:var(--muted)\"><span data-src=\"nasm\">NASM<\u002Fspan> Table 9.9 prescribes 30–60 s holds, 1–3 repetitions, 1–3 sets. NASM defines static stretching as holding for at least 30 s.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"static\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revStatic }}\">{{ revStaticLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"pnf\" data-screen-label=\"PNF and assisted\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>PNF and assisted stretching<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Proprioceptive neuromuscular facilitation combines passive movement with active contractions to increase range, usually with a partner.<\u002Fp>\n        <p><span data-src=\"nsca\">NSCA<\u002Fspan> It's widely believed to be the most effective method for increasing flexibility, but the evidence is inconsistent. Of the three techniques, <strong>hold–relax with agonist contraction<\u002Fstrong> beats hold–relax or contract–relax alone.<\u002Fp>\n\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:1rem 0\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem\">\n            <button type=\"button\" data-i=\"0\" sc-camel-on-click=\"{{ setPnf }}\" style=\"{{ pnfBtn0 }}\">Hold–relax<\u002Fbutton>\n            <button type=\"button\" data-i=\"1\" sc-camel-on-click=\"{{ setPnf }}\" style=\"{{ pnfBtn1 }}\">Contract–relax<\u002Fbutton>\n            <button type=\"button\" data-i=\"2\" sc-camel-on-click=\"{{ setPnf }}\" style=\"{{ pnfBtn2 }}\">Hold–relax with agonist contraction<\u002Fbutton>\n            <button type=\"button\" data-i=\"3\" sc-camel-on-click=\"{{ setPnf }}\" style=\"{{ pnfBtn3 }}\">CRAC<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ pnfIs0 }}\" hint-placeholder-val=\"{{ true }}\"><div>\n            <p style=\"font-size:.92rem\"><span data-src=\"nsca\">NSCA<\u002Fspan> Passive stretch, then an isometric push against the partner, then a deeper passive stretch. <strong>Repeat 3–4 times.<\u002Fstrong><\u002Fp>\n            <div style=\"display:flex;height:64px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden\">\n              <div style=\"flex:10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--blue-soft)\">Passive stretch<span>10 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--red-soft);color:var(--red)\">Isometric<span>6 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--surface);color:var(--muted)\">Relax<span>2 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;background:var(--blue-soft)\">Passive restretch<span>30 s<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Partner takes the muscle to mild discomfort and holds; athlete pushes against resistance without moving; brief relaxation; partner moves to the new point of discomfort and holds. One rep ≈ 48 s.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ pnfIs1 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <p style=\"font-size:.92rem\"><span data-src=\"nsca\">NSCA<\u002Fspan> Passive stretch, then a concentric contraction through full range against gentle resistance, then a deeper passive stretch. The book gives no time for the concentric phase; 6 s is shown for scale. <strong>Repeat 3–4 times.<\u002Fstrong><\u002Fp>\n            <div style=\"display:flex;height:64px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden\">\n              <div style=\"flex:10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--blue-soft)\">Passive stretch<span>10 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--red-soft);color:var(--red)\">Concentric<span>6 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--surface);color:var(--muted)\">Relax<span>2 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;background:var(--blue-soft)\">Passive restretch<span>30 s<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Contract the stretched muscle through full range while the partner resists, then relax and restretch. One rep ≈ 48 s.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ pnfIs2 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <p style=\"font-size:.92rem\"><span data-src=\"nsca\">NSCA<\u002Fspan> Like hold–relax, but during the final stretch the athlete contracts the opposing (agonist) muscle while the partner moves deeper. <strong>Repeat 3–4 times. NSCA's most effective option.<\u002Fstrong><\u002Fp>\n            <div style=\"display:flex;height:64px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden\">\n              <div style=\"flex:10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--blue-soft)\">Passive stretch<span>10 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--red-soft);color:var(--red)\">Isometric<span>6 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--surface);color:var(--muted)\">Relax<span>2 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;background:var(--amber-soft);color:var(--amber-ink)\">Agonist contraction + restretch<span>30 s<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Contract the opposing muscle while the partner stretches to the new point of discomfort. One rep ≈ 48 s.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ pnfIs3 }}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <p style=\"font-size:.92rem\"><span data-src=\"nasm\">NASM<\u002Fspan> NASM's assisted method. Contraction and repositioning times aren't specified, so those phases are drawn for scale. <strong>Repeat 3–5 times; 2–5 sets, 2–4 days/week.<\u002Fstrong><\u002Fp>\n            <div style=\"display:flex;height:64px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden\">\n              <div style=\"flex:5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--blue-soft)\">To end range<span>5 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--red-soft);color:var(--red)\">Contract 40–70%<span>6 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;border-right:1.5px solid var(--rule);background:var(--amber-soft);color:var(--amber-ink)\">New range<span>3 s<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:25;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;text-align:center;padding:0 .25rem;background:var(--blue-soft)\">Hold 20–30 s<span>25 s<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:.9rem;color:var(--muted);margin:.5rem 0 0\">Move to end range where the joint begins to compensate, contract at 40–70% MVIC, move to a new end range, then statically hold. One rep ≈ 39 s.<\u002Fp>\n          <\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\">\n          <span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">The names don't line up between books<\u002Fspan>\n          <p><span data-src=\"nsca\">NSCA<\u002Fspan> <strong>Hold–relax<\u002Fstrong> uses an <strong>isometric<\u002Fstrong> contraction. <strong>Contract–relax<\u002Fstrong> uses a <strong>concentric<\u002Fstrong> contraction through full range against resistance.<\u002Fp>\n          <p><span data-src=\"nasm\">NASM<\u002Fspan> describes <strong>HR<\u002Fstrong> as an <em>isotonic<\u002Fem> contraction resisted by a third party and <strong>CR<\u002Fstrong> as a <em>self-applied isometric<\u002Fem>. That reverses the contraction types relative to NSCA. NASM's <strong>CRAC<\u002Fstrong> (contract–relax–agonist–contract) corresponds to NSCA's hold–relax with agonist contraction.<\u002Fp>\n          <p style=\"margin-bottom:0\">Answer using whichever book the question comes from.<\u002Fp>\n        <\u002Fdiv>\n\n        <h3>Safety before any PNF routine <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>Both people must understand the technique: the correct exercises, where supporting hands or equipment go, how far to stretch (to discomfort, never pain), and how much resistance to apply. Getting this wrong can injure the person being stretched. Partner positions for each stretch are in the <a href=\"#library\">exercise library<\u002Fa>.<\u002Fp>\n\n        <h3>Assisted stretching with CRAC <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Help from a coach, athletic trainer, or physical therapist lets the athlete reach more range than they could alone. The main advantage is being able to add contractions of the agonist or antagonist while the stretch is held. Proposed mechanisms are autogenic inhibition, thixotropy, and altered stretch tolerance; CRAC adds reciprocal inhibition when the shortened muscle contracts to move into more range.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption>Recommended CRAC protocol<\u002Fsc-raw-caption>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th>What happens<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Take the muscle to end range (the point where the joint starts to compensate).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Actively contract the muscle being stretched at <strong>40–70% of maximal voluntary isometric contraction<\u002Fstrong> (Lim, 2018).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Move passively or actively to a new end range.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Hold the new position <strong>20–30 s<\u002Fstrong>; repeat <strong>3–5 times<\u002Fstrong>.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p>Kurz (2003) recommends <strong>2–5 sets of 3–5 contractions per muscle group, 2–4 days per week<\u002Fstrong>, across 3–10 muscle groups. Moderate contraction intensity gives a real training effect while limiting load on the tissue; the exact intensity can vary by practitioner and athlete.<\u002Fp>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px dashed var(--muted);background:var(--card)\">\n          <span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Your notes: assisted hamstring stretch video<\u002Fspan>\n          <ul style=\"margin:.2rem 0\">\n            <li>Position: hip flexion plus adduction<\u002Fli>\n            <li>Static stretch 20–30 s<\u002Fli>\n            <li>Athlete pushes toward hip extension with slight knee flexion at about 20% of max, 7–10 s<\u002Fli>\n            <li>Relax, move to the new resistance barrier, contract the quadriceps into the new barrier, hold 20–30 s<\u002Fli>\n          <\u002Ful>\n          <p style=\"font-size:.92rem;margin:.4rem 0 0\">Note that 20% is below the 40–70% MVIC range in the chapter text. If an exam asks for the recommended intensity, use 40–70%.<\u002Fp>\n        <\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"pnf\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revPnf }}\">{{ revPnfLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"dynamic\" data-screen-label=\"Active, dynamic, ballistic\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Active, dynamic, and ballistic stretching<\u002Fh2>\n\n        <h3>Active stretching <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>Uses agonists and synergists to move the joint into range, which raises motor neuron excitability and reciprocally inhibits the muscle being stretched. In an active supine hamstring stretch, the quadriceps extend the knee. That lengthens the hamstrings and inhibits them at the same time.<\u002Fp>\n        <p>Static and active stretches use the same positions. The difference is the hold: static holds for a set time such as 30 s, while active holds <strong>1–2 s for 5–10 reps<\u002Fstrong>, 1–3 sets. Use active stretching before competition or high-intensity work; if the athlete has imbalances, do it after SMT and static stretching of overactive muscles.<\u002Fp>\n\n        <h3>Dynamic stretching<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\"><span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh4>\n            <ul>\n              <li>Controlled, activity-specific movements that activate muscles and tendons before activity.<\u002Fli>\n              <li>Negates stretch-induced strength loss and improves sprinting, jumping, and peak force, possibly by preparing the musculotendinous junctions.<\u002Fli>\n              <li>Should mimic job tasks: elongate the muscle while keeping blood flow and body temperature up and activating the nervous system.<\u002Fli>\n              <li><strong>Mobility exercises<\u002Fstrong> (hurdles, medicine ball circuit) fit the warm-up, progressing from low to high intensity through full range. They can also go inside the workout to address deficiencies.<\u002Fli>\n              <li>Dynamic stretches in the library: 5–10 reps per side.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\"><span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh4>\n            <ul>\n              <li>Uses muscle force and momentum to move a joint through its full available range, stretching the muscle–tendon unit at speed.<\u002Fli>\n              <li>Can be static or active, but research almost always means the active type: concentric agonist contractions plus momentum. Main proposed mechanism: reciprocal inhibition.<\u002Fli>\n              <li>Improves countermovement jump (Carvalho et al., 2012; Holt &amp; Lambourne, 2008; Perrier et al., 2011). Game-like speeds carry over better to the field (Needham et al., 2009). Improved golf club head and ball speed (Moran et al., 2009).<\u002Fli>\n              <li>Mimic the session's main task: before squatting, do unloaded squats with gradually larger amplitude and faster tempo.<\u002Fli>\n              <li>Dose: 1–2 sets of 10–15 reps, 3–10 exercises.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--blue);background:var(--blue-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">NSCA key point: the dynamic warm-up<\u002Fspan>A general warm-up of 5–10 minutes of aerobic activity combined with a dynamic flexibility routine, used before practices and games to trigger physiological and sport-specific responses.<\u002Fdiv>\n\n        <h3>Ballistic stretching <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>Bouncing, swinging, or jerking into positions similar to static stretches, using body weight for force without holding the end point. It usually exceeds end range, can cause more pain and microtears, and triggers the stretch reflex so the muscle can't relax. Historically used before sprinting, dance, and gymnastics.<\u002Fp>\n        <p><strong>Not recommended for tactical athletes<\u002Fstrong> because of possible connective tissue trauma, local soreness, and higher injury risk. Even though officers sprint after suspects and soldiers bound between positions, the downsides could compromise job performance.<\u002Fp>\n\n        <h3>Yoga <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>An ancient mind–body practice blending static and dynamic poses that both stretch and strengthen. Each pose emphasizes breathing and alignment, with holds of 15–90 s. It gently lengthens muscles, increases ROM, and relieves tension and soreness.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"dynamic\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revDynamic }}\">{{ revDynamicLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"myofascial\" data-screen-label=\"Myofascial techniques\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Myofascial techniques<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">Same tools, different explanations. NSCA calls it myofascial release and credits mechanical changes in fascia. NASM dropped \"release\" and credits the nervous system.<\u002Fp>\n\n        <h3>Myofascial release <span data-src=\"nsca\">NSCA<\u002Fspan><\u002Fh3>\n        <p>A manual therapy developed by <strong>Barnes<\u002Fstrong> to reduce adhesions in fascia. A provider such as an athletic trainer, physical therapist, or licensed massage therapist applies manual pressure through massage or trigger-point therapy. Physiotherapists spend about <strong>45%<\u002Fstrong> of their time on massage to aid recovery and performance.<\u002Fp>\n        <p><strong>Massage benefits:<\u002Fstrong> better circulation, muscle relaxation, loosened scar tissue, stretched muscles and fascia, relief of spasms. It also helps heart rate and diastolic blood pressure return to pre-exercise levels after high-intensity work and reduces exercise-induced fatigue. That matters for tactical athletes with bursts of high cardiovascular demand, like firefighters, whose cardiac event risk is significant.<\u002Fp>\n        <p><strong>Self-myofascial release (SMR)<\u002Fstrong> with foam rollers or dense objects like baseballs or golf balls needs no therapist. Body weight applies sustained pressure that softens and lengthens fascia. Friction warms the fascia into a more fluid state (its <strong>thixotropic<\u002Fstrong> property), breaks down scar tissue and adhesions between skin, muscle, and bone, and restores extensibility.<\u002Fp>\n        <ul>\n          <li>MacDonald et al.: as little as <strong>2 minutes<\u002Fstrong> of slow, undulating rolling on a high-pressure roller raised quadriceps ROM to levels similar to static stretching, with <strong>no effect on force output<\u002Fstrong>.<\u002Fli>\n          <li>Healey et al.: significantly less post-exercise fatigue after rolling, which might let athletes extend workout time and volume.<\u002Fli>\n          <li>Research on SMR for flexibility and performance is limited, but studies support better mood and less exercise-induced fatigue.<\u002Fli>\n          <li>Rollers are inexpensive, light, compact, and portable. Denser rollers apply significantly more pressure.<\u002Fli>\n        <\u002Ful>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-caption><span data-src=\"nsca\">NSCA<\u002Fspan> foam rolling guidelines<\u002Fsc-raw-caption>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Avoid rolling over joints or areas with little soft tissue.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Position the roller directly over or under the target area.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Start with gentle pressure above or below the target, rolling back and forth and working slowly through the middle toward the end point before returning.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Roll each area <strong>15–30 s<\u002Fstrong>. On extremely sensitive spots, stop and apply gradual pressure for <strong>30–60 s<\u002Fstrong> before continuing.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Focus on areas with restricted ROM, soreness, or tightness.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Beginners may take a day off between sessions until adhesions soften or become more tolerable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n\n        <h3>Self-myofascial techniques <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <p>NASM moved away from \"myofascial release\" because evidence doesn't support the idea of releasing fascia (Behm &amp; Wilke, 2019). More plausible explanations are neurological: changes in parasympathetic-driven muscle tone, reflexes, and pain tolerance. Some techniques require specialized education or state licensure, so NASM recommends coaches teach athletes <strong>SMT<\u002Fstrong> they can apply on their own.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Mechanical effect<\u002Fh4><p style=\"margin-bottom:0\">Direct roller compression may relax local myofascia by increasing blood flow and reducing restrictions and adhesions.<\u002Fp><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Neurophysiological effect<\u002Fh4><p style=\"margin-bottom:0\">Compression stimulates local mechanoreceptors and pain receptors, which send inhibitory signals to the CNS and trigger relaxation and pain-blocking responses.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <ul>\n          <li>Rolling in a warm-up gives ROM gains similar to stretching (Wilke et al., 2020) with little or no performance cost (Halperin et al., 2014).<\u002Fli>\n          <li>After a workout, it may reduce DOMS (Jay et al., 2014).<\u002Fli>\n          <li>Find a tender spot and sustain pressure <strong>at least 30 s<\u002Fstrong>. It may take longer if the athlete struggles to consciously relax.<\u002Fli>\n          <li>Roll <strong>before<\u002Fstrong> stretching; it may make static stretching more effective (Škarabot et al., 2015).<\u002Fli>\n          <li>The foam roller is the most popular SMT tool among fitness and medical professionals.<\u002Fli>\n        <\u002Ful>\n\n        <h3>Tools and their doses <span data-src=\"nasm\">NASM<\u002Fspan><\u002Fh3>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Technique<\u002Fsc-raw-th><sc-raw-th>Reps<\u002Fsc-raw-th><sc-raw-th>Rep duration<\u002Fsc-raw-th><sc-raw-th>Total<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:7rem\">Roller / ball<\u002Fsc-raw-td><sc-raw-td>1–3<\u002Fsc-raw-td><sc-raw-td>2–4 s<\u002Fsc-raw-td><sc-raw-td>30–120 s<\u002Fsc-raw-td><sc-raw-td>Balls such as tennis balls are portable and cheap, with the same dosing as rolling.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:7rem\">Vibration<\u002Fsc-raw-td><sc-raw-td>3–6<\u002Fsc-raw-td><sc-raw-td>30–120 s<\u002Fsc-raw-td><sc-raw-td>6–12 min<\u002Fsc-raw-td><sc-raw-td>Vibrating rollers gave greater flexibility and mobility gains and less pain than non-vibrating ones, without hurting performance. Studies used different frequencies and amplitudes, so no specific setting can be prescribed; low and high settings seem to work similarly. Pain relief likely comes from <strong>vibratory analgesia<\u002Fstrong>: vibration stimulates mechanoreceptors that temporarily interfere with pain sensation.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:7rem\">Percussion<\u002Fsc-raw-td><sc-raw-td>1–2<\u002Fsc-raw-td><sc-raw-td>30–60 s<\u002Fsc-raw-td><sc-raw-td>3–5 min<\u002Fsc-raw-td><sc-raw-td>Handheld guns deliver rapid impacts, often thousands of rpm. Similar ROM gains to a massage therapist, with no strength loss (Konrad et al., 2020). An option for athletes who can't tolerate rolling.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700;min-width:7rem\">IASTM<\u002Fsc-raw-td><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>5 min<\u002Fsc-raw-td><sc-raw-td>Variable<\u002Fsc-raw-td><sc-raw-td>Stainless-steel instruments with beveled edges replace the therapist's hands; a specialized intervention used in physical therapy. A 5-minute application to the back of the lower leg significantly increased ankle dorsiflexion (Ikeda et al., 2019).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--rule);background:var(--card)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem\">Percussion survey (Cheatham et al., 2021)<\u002Fspan>Of 425 professionals, most used low or medium speed for pre- and post-exercise (62%), pain modulation (59%), and myofascial mobility (52%). Treatment times were mostly 30 s to 3 min (36–48%) or 3–5 min (18–22%). Most (54–69%) believed percussion increases local blood flow, modulates pain, improves myofascial mobility, and reduces restrictions.<\u002Fdiv>\n\n        <h3>Handheld rollers<\u002Fh3>\n        <p>Pressure is user-controlled, so size and density matter less. A good fit for people who can't get on the floor, and some collapse for travel. Limitations:<\u002Fp>\n        <ul>\n          <li>Two-handed models are mostly limited to the lower body.<\u002Fli>\n          <li>Some muscle groups are hard to reach while keeping a safe posture.<\u002Fli>\n          <li>Pressure is capped by upper-body strength or an upper-extremity injury.<\u002Fli>\n        <\u002Ful>\n        <p>If the athlete can get on the floor, a cylindrical roller is preferred. Coaches shouldn't apply a handheld roller to their athletes; the athlete controls the pressure, which is safer and builds self-reliance.<\u002Fp>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"myofascial\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revMyofascial }}\">{{ revMyofascialLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"advanced\" data-screen-label=\"Stick Mobility\" style=\"padding:1.6rem 0 1rem;border-top:1px solid var(--line);scroll-margin-top:12px\">\n        <h2>Stick Mobility<\u002Fh2>\n        <p><span data-src=\"nasm\">NASM<\u002Fspan> A system of flexibility, strength, and coordination training that uses a flexible rod plus body weight as resistance. It draws on increased neuromuscular drive to gain more mobility and stability than traditional stretching alone. It follows dynamic stretching guidelines but can also be done as static or active work, and resembles traditional flexibility training in martial arts, dance, and gymnastics. Coordinating muscles and joints as one system aims to balance the whole kinetic chain.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0\">\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Core principles<\u002Fh4><ul style=\"margin-bottom:0\"><li>Mechanical leverage<\u002Fli><li>Stable training positions<\u002Fli><li>Visual and kinesthetic feedback<\u002Fli><li><strong>Irradiation<\u002Fstrong>: tensing one muscle recruits its neighbors<\u002Fli><li>Varied types of isometric contraction<\u002Fli><li>Neural coordination<\u002Fli><\u002Ful><\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem\"><h4 style=\"margin-top:0\">Acute variables<\u002Fh4><ul style=\"margin-bottom:0\"><li>Mechanism: reciprocal inhibition<\u002Fli><li>1 set<\u002Fli><li>8–10 reps<\u002Fli><li>1–2 s hold at end range<\u002Fli><li>3–10 exercises<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"advanced\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revAdvanced }}\">{{ revAdvancedLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">Exercise library<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Every exercise from both chapters with coaching cues and dose. Filter by method or search by muscle.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"library\" data-screen-label=\"Exercise library\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>All exercises<\u002Fh2>\n        <p>Blue-topped entries are from <span data-src=\"nsca\">NSCA<\u002Fspan>, which gives full written technique. Red-topped entries are from the <span data-src=\"nasm\">NASM<\u002Fspan> handouts and video lists, which are pictures and titles only, so their cues are short position notes.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.8rem 0\">\n          <input type=\"search\" value=\"{{ libQ }}\" sc-camel-on-change=\"{{ setLibQ }}\" placeholder=\"Search by exercise or muscle, e.g. hip flexor\" style=\"font:inherit;padding:.45rem .7rem;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--card);color:var(--ink);flex:1 1 220px;min-width:0\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0\">\n          <sc-for list=\"{{ libFilters }}\" as=\"f\" hint-placeholder-count=\"9\">\n            <button type=\"button\" data-k=\"{{ f.key }}\" sc-camel-on-click=\"{{ setLibFilter }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:.9rem;color:var(--muted);margin:.2rem 0 .6rem\">{{ libCount }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:.7rem\">\n          <sc-for list=\"{{ libRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"{{ row.wrapStyle }}\">\n              <sc-if value=\"{{ row.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"grid-column:1/-1;font-family:'Anybody',Arial,sans-serif;font-variation-settings:'wdth' 70;font-weight:760;font-size:1.25rem;margin:.9rem 0 .1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap\">{{ row.title }} <span data-src=\"{{ row.src }}\">{{ row.srcLabel }}<\u002Fspan> <small style=\"font-family:inherit;font-size:.85rem;font-weight:400;color:var(--muted)\">{{ row.note }}<\u002Fsmall><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.isCard }}\" hint-placeholder-val=\"{{ true }}\">\n                <article style=\"{{ row.cardStyle }}\">\n                  <h4 style=\"margin:0 0 .15rem;font-size:1rem\">{{ row.n }}<\u002Fh4>\n                  <div style=\"font-size:.82rem;color:var(--muted);margin-bottom:.35rem\">{{ row.r }}<\u002Fdiv>\n                  <p style=\"margin:.25rem 0;font-size:.92rem;line-height:1.45\">{{ row.c }}<\u002Fp>\n                  <div style=\"font-size:.86rem;font-weight:700;border-top:1px dashed var(--line);margin-top:.45rem;padding-top:.35rem\">{{ row.d }}<\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ libEmpty }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color:var(--muted)\">No exercises match. Try a muscle name like \"calf\" or clear the filter.<\u002Fp><\u002Fsc-if>\n        <div data-note=\"1\" style=\"margin:1.2rem 0;padding:.8rem 1rem;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--card)\">\n          <div style=\"font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">My notes<\u002Fdiv>\n          <div data-note-field=\"1\" data-placeholder=\"Click here and type — your notes save in this browser.\" contenteditable=\"true\" sc-camel-on-input=\"{{ saveNote }}\" sc-camel-on-blur=\"{{ saveNote }}\" style=\"min-height:3.2rem;outline:none;color:var(--ink);line-height:1.6\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" data-sec=\"library\" sc-camel-on-click=\"{{ toggleReviewed }}\" style=\"{{ revLibrary }}\">{{ revLibraryLabel }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <div style=\"margin:3.2rem 0 1rem;padding-top:1.4rem;border-top:2px solid var(--rule)\">\n        <p style=\"font-family:'Anybody',Arial,sans-serif;font-weight:850;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;font-variation-settings:'wdth' 58;margin:0\">Programming<\u002Fp>\n        <p style=\"margin:.5rem 0 0;color:var(--muted)\">Sets, reps, intensity, frequency, and volume, then how to assemble them for a sport or a shift.<\u002Fp>\n      <\u002Fdiv>\n\n      <section id=\"dosing\" data-screen-label=\"Acute variables\" style=\"padding:1.6rem 0 1rem;scroll-margin-top:12px\">\n        <h2>Acute training variables<\u002Fh2>\n        <p style=\"font-size:1.14rem;color:var(--muted)\">NASM gives the most specific numbers. This table merges its Tables 9.3, 9.4, 9.5, 9.10–9.13 so every variable for a method sits in one row.<\u002Fp>\n        <div style=\"overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--card)\"><sc-raw-table>\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Method<\u002Fsc-raw-th><sc-raw-th>Sets<\u002Fsc-raw-th><sc-raw-th>Reps / duration<\u002Fsc-raw-th><sc-raw-th>Intensity<\u002Fsc-raw-th><sc-raw-th>Frequency<\u002Fsc-raw-th><sc-raw-th>Volume<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">SMT<\u002Fsc-raw-td><sc-raw-td>1 per body part<\u002Fsc-raw-td><sc-raw-td>30–60 s; no more than 120 s per muscle group<\u002Fsc-raw-td><sc-raw-td>Some discomfort, but breathing normally and relaxed<\u002Fsc-raw-td><sc-raw-td>Daily or most days<\u002Fsc-raw-td><sc-raw-td>5–10 min per session; 90–120 s per muscle group<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Static<\u002Fsc-raw-td><sc-raw-td>1–3<\u002Fsc-raw-td><sc-raw-td>Hold 30 s (Table 9.3); text recommends 30–60 s<\u002Fsc-raw-td><sc-raw-td>First point of resistance; mild discomfort OK for some<\u002Fsc-raw-td><sc-raw-td>2–6 days/week<\u002Fsc-raw-td><sc-raw-td>5–10 min per week per muscle group<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Active<\u002Fsc-raw-td><sc-raw-td>1–3<\u002Fsc-raw-td><sc-raw-td>Hold 1–2 s, 5–10 reps<\u002Fsc-raw-td><sc-raw-td>First point of resistance; mild discomfort OK for some<\u002Fsc-raw-td><sc-raw-td>2–6 days/week<\u002Fsc-raw-td><sc-raw-td>5–10 min per week per muscle group<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Dynamic<\u002Fsc-raw-td><sc-raw-td>1–2<\u002Fsc-raw-td><sc-raw-td>10–15 reps; 3–10 exercises<\u002Fsc-raw-td><sc-raw-td>Body weight<\u002Fsc-raw-td><sc-raw-td>2–6 days/week<\u002Fsc-raw-td><sc-raw-td>6–10 min per session<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Assisted (CRAC)<\u002Fsc-raw-td><sc-raw-td>2–5<\u002Fsc-raw-td><sc-raw-td>3–5 contractions per muscle group; hold new position 20–30 s; 3–10 muscle groups<\u002Fsc-raw-td><sc-raw-td>40–70% MVIC<\u002Fsc-raw-td><sc-raw-td>2–4 days/week<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:700\">Stick Mobility<\u002Fsc-raw-td><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>8–10 reps, 1–2 s end-range hold; 3–10 exercises<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"margin:1.2rem 0;padding:.85rem 1rem;border-radius:0 8px 8px 0;border-left:4px solid var(--amber);background:var(--amber-soft)\"><span style=\"font-weight:700;display:block;margin-bottom:.2rem;color:var(--amber-ink)\">Numbers that shift inside NASM<\u002Fspan>Static: Table 9.3 says hold 30 s, while the text and Table 9.9 say 30–60 s. Dynamic: the text says 1 set of 10 reps, Table 9.3 says 1–2 sets of 10–15, and Table 9.11 says 1 set of 10–15.<\u002Fdiv>\n\n        <h3>Intensity<\u002Fh3>\n        <ul>\n          <li>Intensity seems to matter even more than duration. High-intensity, short stretches beat low-intensity, long ones for ROM gains (Fukaya et al., 2020).<\u002Fli>\n          <li>They do different things: <strong>longer durations lower passive torque<\u002Fstrong>, while <strong>higher intensities increase joint angle<\u002Fstrong> more (Freitas et al., 2015).<\u002Fli>\n          <li>Stretching to maximal tolerable discomfort isn't necessary (Behm, 2019). Gains appear at 30–40% of max intensity, and <strong>60–85%<\u002Fstrong> gives substantial benefit (Behm, 2018).<\u002Fli>\n          <li>In untrained people, high and low intensities produced similar gains (Santos et al., 2020).<\u002Fli>\n          <li>Coach to <strong>mild discomfort<\u002Fstrong> where the athlete can relax for the whole hold. Do only as many sets as keep adding ROM; stop when a set gains nothing over the previous one.<\u002Fli>\n        <\u002Ful>\n\n        <h3>Frequency<\u002Fh3>\n        <ul>\n          <li>Not well studied; likely depends on technique intensity. Even static stretching can cause DOMS (Smith et al., 1993), so allow recovery.<\u002Fli>\n          <li>Three times per week beat once per week for ankle dorsiflexion ROM an
